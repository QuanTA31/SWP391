spring.application.name=SWP391_AssetManagement

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/asset_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# JPA / Hibernate
#spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.highlight_sql=true

# Logging Hibernate
#logging.level.org.hibernate=warn
#logging.level.org.hibernate.orm.connections.pooling=warn
#logging.level.org.hibernate.engine.transaction.jta.platform.internal=warn

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Session
spring.session.jdbc.initialize-schema=always
spring.session.timeout=1800

server.port=9090
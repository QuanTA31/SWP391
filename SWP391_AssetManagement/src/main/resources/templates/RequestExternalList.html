<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Asset Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/RequestExternalList.css}">
</head>

<body>

<div class="app-wrapper">

    <!-- HEADER -->
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Request List</span>
    </div>

    <div class="app-content">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">Main View Asset</div>
            <div class="menu-item">Create Request</div>
            <div class="menu-item active">View External Request</div>
            <div class="menu-item">Approval Request</div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content-right">

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">View Request</span>
                </div>

                <!-- FILTER -->
                <form method="get" th:action="@{/main/viewExternalRequest}">
                    <div class="toolbar-right">

                        <!-- REQUEST STATUS -->
                        <select name="requestStatusId" class="form-select form-select-sm">
                            <option value="">Request Status</option>
                            <option th:each="st : ${T(com.example.swp391_assetmanagement.enums.RequestStatus).values()}"
                                    th:value="${st.value}"
                                    th:text="${st.name}"
                                    th:selected="${external != null
                                      and external.filters != null
                                      and external.filters.requestStatusId != null
                                      and st.value == external.filters.requestStatusId}">
                            </option>
                        </select>

                        <!-- REQUEST TYPE -->
                        <select name="requestTypeId" class="form-select form-select-sm">
                            <option value="">Request Type</option>
                            <option th:each="tp : ${T(com.example.swp391_assetmanagement.enums.RequestType).values()}"
                                    th:value="${tp.value}"
                                    th:text="${tp.name}"
                                    th:selected="${external != null
                                      and external.filters != null
                                      and external.filters.requestTypeId != null
                                      and tp.value == external.filters.requestTypeId}">
                            </option>
                        </select>



                        <button class="btn btn-sm btn-save-draft" type="submit">
                            Apply Filter
                        </button>
                    </div>
                </form>
            </div>

            <!-- TABLE -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-sm table-hover table-fixed">
                        <thead>
                        <tr>
<!--                            <th>Asset</th>-->
                            <th>Asset Request</th>
                            <th>Asset Type</th>
                            <th>External Status</th>
                            <th>Quantity</th>

<!--                            <th>From Location</th>-->
<!--                            <th>To Location</th>-->
<!--                            <th>From User</th>-->
<!--                            <th>To User</th>-->
                            <!--                            <th>Execution Date</th>-->
                            <!--                            <th>Handover Date</th>-->
                            <!--                            <th>Approval Status</th>-->
                            <th>Note</th>
                            <th>Create At</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!-- NO external -->
                        <tr th:if="${external == null
                                or external.externalProcessResponses == null
                                or external.externalProcessResponses.isEmpty()}">
                            <td colspan="9" class="text-center text-muted">
                                No data found
                            </td>
                        </tr>

                        <!-- HAS external -->
                        <tr th:each="item : ${external.externalProcessResponses}">
<!--                            <td th:text="${item.assetId}"></td>-->
                            <td th:text="${item.assetRequestName}"></td>
                            <td th:text="${item.assetTypeName}"></td>
                            <td th:text="${item.externalStatusName}"></td>
                            <td th:text="${item.quantity}"></td>
<!--                            <td th:text="${item.fromLocationName}"></td>-->
<!--                            <td th:text="${item.toLocationName}"></td>-->
<!--                            <td th:text="${item.fromUserName}"></td>-->
<!--                            <td th:text="${item.toUserName}"></td>-->
                            <!--                            <td th:text="${#temporals.format(item.dateOfExecution, 'yyyy-MM-dd')}"></td>-->
                            <!--                            <td th:text="${#temporals.format(item.handoverDate, 'yyyy-MM-dd')}"></td>-->
                            <!--                            <td th:text="${item.approvalStatusName}"></td>-->
                            <td th:text="${item.note}"></td>
                            <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}"></td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- PAGINATION -->
            <div class="content-pagination">

                <div class="pagination-info"
                     th:if="${external != null and external.filters != null}">
                    Showing
                    <strong th:text="${(external.filters.page - 1) * external.filters.pageSize + 1}">1</strong>
                    –
                    <strong th:text="${(external.filters.page - 1) * external.filters.pageSize
                            + (external.externalProcessResponses != null ? external.externalProcessResponses.size() : 0)}">15</strong>
                    of
                    <strong th:text="${external.filters.totalItems}">0</strong>
                </div>

                <ul class="pagination pagination-sm mb-0">

                    <!-- PREVIOUS -->
                    <li class="page-item"
                        th:classappend="${external == null or !external.filters.hasPreviousPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/main/viewExternalRequest(
                               pageIndex=${external.filters.page - 1},
                               requestStatusId=${external.filters.requestStatusId},
                               requestTypeId=${external.filters.requestTypeId}

                           )}">
                            «
                        </a>
                    </li>

                    <!-- PAGE NUMBERS -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, external.filters.totalPages)}"
                        th:classappend="${i == external.filters.page} ? 'active'">
                        <a class="page-link"
                           th:text="${i}"
                           th:href="@{/main/viewExternalRequest(
                               pageIndex=${i},
                               requestStatusId=${external.filters.requestStatusId},
                               requestTypeId=${external.filters.requestTypeId}
                           )}">
                        </a>
                    </li>

                    <!-- NEXT -->
                    <li class="page-item"
                        th:classappend="${external == null or !external.filters.hasNextPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/main/viewExternalRequest(
                               pageIndex=${external.filters.page + 1},
                               requestStatusId=${external.filters.requestStatusId},
                               requestTypeId=${external.filters.requestTypeId}
                           )}">
                            »
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </div>
</div>

</body>
</html>

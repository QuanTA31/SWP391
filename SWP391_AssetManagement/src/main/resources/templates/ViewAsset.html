<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Asset Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ViewAsset.css}">
</head>

<body>

<div class="app-wrapper">

    <!-- HEADER -->
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Copy base</span>
    </div>

    <div class="app-content">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item active">Main View Asset</div>
            <div class="menu-item">Create Request</div>
            <div class="menu-item">View Request</div>
            <div class="menu-item">Approval Request</div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content-right">

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">Main View Asset</span>
                </div>

                <!-- FILTER -->
                <form method="get" th:action="@{/manager/viewAsset}">
                    <div class="toolbar-right">

                        <!-- LOCATION -->
                        <select name="locationId" class="form-select form-select-sm">
                            <option value="">Location</option>
                            <option th:each="loc : ${T(com.example.swp391_assetmanagement.enums.Location).values()}"
                                    th:value="${loc.value}"
                                    th:text="${loc.name}"
                                    th:selected="${assets.filters != null
                                  and assets.filters.locationId != null
                                  and loc.value == assets.filters.locationId}">
                            </option>
                        </select>

                        <!-- ASSET TYPE -->
                        <select name="assetTypeId" class="form-select form-select-sm">
                            <option value="">Asset Type</option>
                            <option th:each="type : ${T(com.example.swp391_assetmanagement.enums.AssetType).values()}"
                                    th:value="${type.value}"
                                    th:text="${type.name}"
                                    th:selected="${assets.filters != null
                                  and assets.filters.assetTypeId != null
                                  and type.value == assets.filters.assetTypeId}">
                            </option>
                        </select>

                        <!-- ASSET STATUS -->
                        <select name="assetStatusId" class="form-select form-select-sm">
                            <option value="">Asset Status</option>
                            <option th:each="status : ${T(com.example.swp391_assetmanagement.enums.AssetStatus).values()}"
                                    th:value="${status.value}"
                                    th:text="${status.name}"
                                    th:selected="${assets.filters != null
                                  and assets.filters.assetStatusId != null
                                  and status.value == assets.filters.assetStatusId}">
                            </option>
                        </select>

                        <button class="btn btn-sm btn-save-draft" type="submit">
                            Apply Filter
                        </button>
                    </div>
                </form>

            </div>

            <!-- TABLE -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-sm table-hover table-fixed">
                        <thead>
                        <tr>
                            <th class="col-checkbox text-center"><input type="checkbox"></th>
                            <th class="col-asset-tag">Asset Code</th>
                            <th>Description</th>
                            <th class="col-price">Price</th>
                            <th class="col-price">Warranty</th>
                            <th class="col-price">Received</th>
                            <th class="col-location">Location</th>
                            <th class="col-price">Status</th>
                            <th class="col-used-by">Current User</th>
                            <th class="col-item-type">Asset Type</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:if="${assets.assetResponses == null || assets.assetResponses.isEmpty()}">
                            <td colspan="10" class="text-center text-muted">
                                No data found
                            </td>
                        </tr>

                        <tr th:each="asset : ${assets.assetResponses}">
                            <td class="text-center"><input type="checkbox"></td>

                            <td th:text="${asset.assetCode}"></td>

                            <td class="text-multiline"
                                th:title="${asset.description}"
                                th:text="${asset.description}">
                            </td>

                            <td th:text="${#numbers.formatDecimal(asset.originalPrice, 0, 'COMMA', 0, 'POINT')}"></td>

                            <td th:text="${asset.warrantyPeriod}"></td>

                            <td th:text="${#temporals.format(asset.receivedDate, 'yyyy-MM-dd')}"></td>

                            <td th:text="${asset.locationName}"></td>

                            <td th:text="${asset.assetStatusName}"></td>

                            <td th:text="${asset.currentUserId}"></td>

                            <td th:text="${asset.assetTypeName}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- PAGINATION -->
            <div class="content-pagination">

                <div class="pagination-info">
                    Showing
                    <strong th:text="${(assets.filters.page -1) * assets.filters.pageSize + 1}">1</strong>
                    –
                    <strong th:text="${(assets.filters.page -1) * assets.filters.pageSize + assets.assetResponses.size()}">15</strong>
                    of
                    <strong th:text="${assets.filters.totalItems}">100</strong>
                </div>

                <ul class="pagination pagination-sm mb-0" style="width: 100px;">

                    <!-- PREVIOUS -->
                    <li class="page-item"
                        th:classappend="${!assets.filters.hasPreviousPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/manager/viewAsset(
                   pageIndex=${assets.filters.page - 1},
                   locationId=${assets.filters.locationId},
                   assetTypeId=${assets.filters.assetTypeId},
                   assetStatusId=${assets.filters.assetStatusId}
               )}">
                            «
                        </a>
                    </li>

                    <!-- PAGE NUMBERS -->
                    <!-- PAGE NUMBERS -->
                    <th:block th:if="${assets.filters.totalPages != null}">
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, assets.filters.totalPages - 1)}"
                            th:classappend="${i == assets.filters.page} ? 'active'">
                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{/manager/viewAsset(
               pageIndex=${i},
               locationId=${assets.filters.locationId},
               assetTypeId=${assets.filters.assetTypeId},
               assetStatusId=${assets.filters.assetStatusId}
           )}">
                            </a>
                        </li>
                    </th:block>

                    <!-- FALLBACK: totalPages = null -->
                    <th:block th:if="${assets.filters.totalPages == null}">
                        <li class="page-item active">
                            <span class="page-link">1</span>
                        </li>
                    </th:block>

                    <!-- NEXT -->
                    <li class="page-item"
                        th:classappend="${!assets.filters.hasNextPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/manager/viewAsset(
                   pageIndex=${assets.filters.page + 1},
                   locationId=${assets.filters.locationId},
                   assetTypeId=${assets.filters.assetTypeId},
                   assetStatusId=${assets.filters.assetStatusId}
               )}">
                            »
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </div>
</div>

</body>
</html>

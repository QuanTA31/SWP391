<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Asset Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/MainView.css}">
  <link rel="stylesheet" th:href="@{/css/ViewAsset.css}">
</head>

<body>

<div class="app-wrapper">

  <!-- HEADER -->
  <div class="app-header">
    <span>Asset Tracker</span>
    <span>Request List</span>
  </div>

  <div class="app-content">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="fw-semibold mb-2">Menu</div>
      <div class="menu-item">Main View Asset</div>
      <div class="menu-item">Create Request</div>
      <div class="menu-item active">View Request</div>
      <div class="menu-item">Approval Request</div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="content-right">

      <!-- TOOLBAR -->
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="fw-semibold">View Request</span>
        </div>

        <!-- FILTER -->
        <form method="get" th:action="@{/main/viewRequest}">
          <div class="toolbar-right">

            <!-- REQUEST STATUS -->
            <select name="requestStatusId" class="form-select form-select-sm">
              <option value="">Request Status</option>
              <option th:each="st : ${T(com.example.swp391_assetmanagement.enums.RequestStatus).values()}"
                      th:value="${st.value}"
                      th:text="${st.name}"
                      th:selected="${data != null
                                      and data.filters != null
                                      and data.filters.requestStatusId != null
                                      and st.value == data.filters.requestStatusId}">
              </option>
            </select>

            <!-- REQUEST TYPE -->
            <select name="requestTypeId" class="form-select form-select-sm">
              <option value="">Request Type</option>
              <option th:each="tp : ${T(com.example.swp391_assetmanagement.enums.RequestType).values()}"
                      th:value="${tp.value}"
                      th:text="${tp.name}"
                      th:selected="${data != null
                                      and data.filters != null
                                      and data.filters.requestTypeId != null
                                      and tp.value == data.filters.requestTypeId}">
              </option>
            </select>

            <!-- APPROVAL STATUS -->
            <select name="approvalStatusId" class="form-select form-select-sm">
              <option value="">Approval Status</option>
              <option th:each="ap : ${T(com.example.swp391_assetmanagement.enums.ApprovalStatus).values()}"
                      th:value="${ap.value}"
                      th:text="${ap.name}"
                      th:selected="${data != null
                                      and data.filters != null
                                      and data.filters.approvalStatusId != null
                                      and ap.value == data.filters.approvalStatusId}">
              </option>
            </select>

            <button class="btn btn-sm btn-save-draft" type="submit">
              Apply Filter
            </button>
          </div>
        </form>
      </div>

      <!-- TABLE -->
      <div class="table-container">
        <div class="table-responsive">
          <table class="table table-sm table-hover table-fixed">
            <thead>
            <tr>
              <th>Request Type</th>
              <th>Request By</th>
              <th>Request Date</th>
              <th>Request Status</th>
              <th>Approve By</th>
              <th>Approve Date</th>
              <th>Handover Date</th>
              <th>Note</th>
              <th>Create At</th>
            </tr>
            </thead>

            <tbody>

            <!-- NO DATA -->
            <tr th:if="${data == null
                                or data.internalProcessResponses == null
                                or data.internalProcessResponses.isEmpty()}">
              <td colspan="9" class="text-center text-muted">
                No data found
              </td>
            </tr>

            <!-- HAS DATA -->
            <tr th:each="item : ${data.internalProcessResponses}">
              <td th:text="${item.assetId}"></td>
              <td th:text="${item.requestStatusName}"></td>
              <td th:text="${item.requestTypeName}"></td>
              <td th:text="${item.fromUserId}"></td>
              <td th:text="${item.toUserId}"></td>
              <td th:text="${#temporals.format(item.dateOfExecution, 'yyyy-MM-dd')}"></td>
              <td th:text="${#temporals.format(item.handoverDate, 'yyyy-MM-dd')}"></td>
              <td th:text="${item.approvalStatusName}"></td>
              <td th:text="${item.note}"></td>
            </tr>

            </tbody>
          </table>
        </div>
      </div>

      <!-- PAGINATION -->
      <div class="content-pagination">

        <div class="pagination-info"
             th:if="${data != null and data.filters != null}">
          Showing
          <strong th:text="${(data.filters.page - 1) * data.filters.pageSize + 1}">1</strong>
          –
          <strong th:text="${(data.filters.page - 1) * data.filters.pageSize
                            + (data.internalProcessResponses != null ? data.internalProcessResponses.size() : 0)}">15</strong>
          of
          <strong th:text="${data.filters.totalItems}">0</strong>
        </div>

        <ul class="pagination pagination-sm mb-0">

          <!-- PREVIOUS -->
          <li class="page-item"
              th:classappend="${data == null or !data.filters.hasPreviousPage} ? 'disabled'">
            <a class="page-link"
               th:href="@{/manager/viewRequest(
                               pageIndex=${data.filters.page - 1},
                               requestStatusId=${data.filters.requestStatusId},
                               requestTypeId=${data.filters.requestTypeId},
                               approvalStatusId=${data.filters.approvalStatusId}
                           )}">
              «
            </a>
          </li>

          <!-- PAGE NUMBERS -->
          <li class="page-item"
              th:each="i : ${#numbers.sequence(1, data.filters.totalPages)}"
              th:classappend="${i == data.filters.page} ? 'active'">
            <a class="page-link"
               th:text="${i}"
               th:href="@{/manager/viewRequest(
                               pageIndex=${i},
                               requestStatusId=${data.filters.requestStatusId},
                               requestTypeId=${data.filters.requestTypeId},
                               approvalStatusId=${data.filters.approvalStatusId}
                           )}">
            </a>
          </li>

          <!-- NEXT -->
          <li class="page-item"
              th:classappend="${data == null or !data.filters.hasNextPage} ? 'disabled'">
            <a class="page-link"
               th:href="@{/manager/viewRequest(
                               pageIndex=${data.filters.page + 1},
                               requestStatusId=${data.filters.requestStatusId},
                               requestTypeId=${data.filters.requestTypeId},
                               approvalStatusId=${data.filters.approvalStatusId}
                           )}">
              »
            </a>
          </li>

        </ul>
      </div>

    </div>
  </div>
</div>

</body>
</html>

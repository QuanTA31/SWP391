<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/manager :: manager-layout(~{::div.content-right})}">
<body>

<div class="content-right">
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="fw-semibold">View Request List</span>
        </div>

        <form method="get" th:action="@{/viewRequest}">
            <div class="toolbar-right">
                <select name="requestStatusId" class="form-select form-select-sm">
                    <option value="">Request Status</option>
                    <option th:each="st : ${T(com.example.swp391_assetmanagement.enums.RequestStatus).values()}"
                            th:value="${st.value}"
                            th:text="${st.name}"
                            th:selected="${data?.filters?.requestStatusId == st.value}">
                    </option>
                </select>

                <select name="requestTypeId" class="form-select form-select-sm">
                    <option value="">Request Type</option>
                    <option th:each="tp : ${T(com.example.swp391_assetmanagement.enums.RequestType).values()}"
                            th:value="${tp.value}"
                            th:text="${tp.name}"
                            th:selected="${data?.filters?.requestTypeId == tp.value}">
                    </option>
                </select>

                <button type="submit" class="btn btn-sm btn-save-draft">Apply Filter</button>
            </div>
        </form>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-fixed">
                <thead>
                <tr>
                    <th>Request Type</th>
                    <th>Requested By</th>
                    <th>Request Date</th>
                    <th>Request Status</th>
                    <th>Approved By</th>
                    <th>Approval Date</th>
                    <th>Handover Date</th>
                    <th>Note</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${data == null or data.allProcessResponses == null or data.allProcessResponses.isEmpty()}">
                    <td colspan="10" class="text-center text-muted">No data found</td>
                </tr>
                <tr th:each="item : ${data.allProcessResponses}">
                    <td th:text="${item.requestTypeName}"></td>
                    <td th:text="${item.requestedBy}"></td>
                    <td th:text="${#temporals.format(item.requestedDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${item.requestStatusName}"></td>
                    <td th:text="${item.approvalBy ?: '-'}"></td>
                    <td th:text="${item.approvalDate != null ? #temporals.format(item.approvalDate, 'yyyy-MM-dd') : '-'}"></td>
                    <td th:text="${item.handoverDate != null ? #temporals.format(item.handoverDate, 'yyyy-MM-dd') : '-'}"></td>
                    <td th:text="${item.note}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}"></td>
                    <td>
                        <th:block th:if="${#strings.equalsIgnoreCase(item.requestTypeName,'PROCUREMENT')}">
                            <a th:if="${session.ROLE == '03' or session.ROLE == '04'}"
                               class="btn btn-sm btn-info text-white"
                               th:href="@{/purchase-requests/warehouse/view(assetRequestId=${item.id})}">View</a>

                            <a th:if="${session.ROLE == '02'}" class="btn btn-sm btn-info text-white"
                               th:href="@{/purchase-requests/manager/view(assetRequestId=${item.id})}">View</a>

                            <form th:if="${item.requestStatusName == 'RESEARCH_DONE' and session.ROLE == '04'}"
                                  th:action="@{/purchase-requests/purchasing/progress}" method="post"
                                  style="display:inline">
                                <input type="hidden" name="requestId" th:value="${item.id}"/>
                                <button type="submit" class="btn btn-sm btn-success"
                                        onclick="return confirm('Move to IN_PROGRESS?')">Process
                                </button>
                            </form>
                        </th:block>

                        <th:block th:unless="${#strings.equalsIgnoreCase(item.requestTypeName,'PROCUREMENT')}">
                            <th:block th:if="${item.isInternal}">
                                <a class="btn btn-sm btn-primary"
                                   th:href="@{/allocation/department/edit(id=${item.id})}">View</a>
                            </th:block>
                            <a th:if="${!item.isInternal}" class="btn btn-sm btn-warning text-dark"
                               th:href="@{/viewExternalRequest/detail(id=${item.id})}">View</a>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="content-pagination" th:if="${data?.filters != null}">
        <div class="pagination-info">
            Showing <strong th:text="${(data.filters.page - 1) * data.filters.pageSize + 1}"></strong>
            – <strong
                th:text="${(data.filters.page - 1) * data.filters.pageSize + data.allProcessResponses.size()}"></strong>
            of <strong th:text="${data.filters.totalItems}"></strong>
        </div>
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${!data.filters.hasPreviousPage} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/viewRequest(pageIndex=${data.filters.page - 1}, requestStatusId=${data.filters.requestStatusId}, requestTypeId=${data.filters.requestTypeId})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, data.filters.totalPages)}"
                th:classappend="${i == data.filters.page} ? 'active'">
                <a class="page-link" th:text="${i}"
                   th:href="@{/viewRequest(pageIndex=${i}, requestStatusId=${data.filters.requestStatusId}, requestTypeId=${data.filters.requestTypeId})}"></a>
            </li>
            <li class="page-item" th:classappend="${!data.filters.hasNextPage} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/viewRequest(pageIndex=${data.filters.page + 1}, requestStatusId=${data.filters.requestStatusId}, requestTypeId=${data.filters.requestTypeId})}">»</a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>

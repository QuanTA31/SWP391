<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Asset Tracker - Inventory Process</title>
    <style>
        .filter-section { background: #f8f9fa; border-radius: 8px; padding: 15px; }
        .is-done-row { background-color: #f0fff4 !important; color: #6c757d; }
        .lost-row { background-color: #fff0f0 !important; color: #dc3545; }
        .table th, .table td { vertical-align: middle; }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <main class="content-right p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold text-primary m-0">Inventory Detail: #<span th:text="${data.requestId}"></span></h5>
            <span class="badge bg-primary px-3 py-2"
                  th:with="typeEnum=${T(com.example.swp391_assetmanagement.enums.RequestStatus).of(data.statusName)}"
                  th:text="${typeEnum != null ? typeEnum.getName() : 'N/A'}">
            </span>
        </div>

        <div class="filter-section mb-4 border">
            <form method="get" th:action="@{/inventory/process}" class="row g-3">
                <input type="hidden" name="requestId" th:value="${data.requestId}">
                <div class="col-md-4">
                    <input type="text" name="fullName" class="form-control form-control-sm"
                           placeholder="Search by User Name..." th:value="${param.fullName}">
                </div>
                <div class="col-md-3">
                    <select name="assetTypeId" class="form-select form-select-sm">
                        <option value="">All Asset Types</option>
                        <option th:each="type : ${T(com.example.swp391_assetmanagement.enums.AssetType).values()}"
                                th:value="${type.value}" th:text="${type.name}"
                                th:selected="${param.assetTypeId == type.value}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Filter</button>
                </div>
            </form>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light text-center">
                    <tr>
                        <th colspan="5">Asset Information</th>
                        <th colspan="2" class="bg-warning bg-opacity-10">Warehouse Inventory</th>
                        <th class="bg-info bg-opacity-10">Database Status</th>
                    </tr>
                    <tr>
                        <th>Asset Code</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>User</th>
                        <th>Warranty Exp</th>
                        
                        <!-- Warehouse -->
                        <th class="bg-warning bg-opacity-10">Status (Found/Lost)</th>
                        <th class="bg-warning bg-opacity-10">Note</th>
                        
                        <!-- DB -->
                        <th class="bg-info bg-opacity-10">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${data.items}" 
                        th:classappend="${item.isDone != null ? (item.isDone ? 'is-done-row' : 'lost-row') : ''}">
                        <td class="fw-bold" th:text="${item.assetCode}"></td>
                        <td th:text="${item.assetTypeName}"></td>
                        <td th:text="${item.locationName}"></td>
                        <td th:text="${item.userFullName}"></td>
                        <td th:text="${item.warrantyPeriod != null ? #temporals.format(item.warrantyPeriod, 'dd/MM/yyyy') : 'N/A'}"></td>
                        
                        <!-- Warehouse Inputs -->
                        <td class="text-center" style="width: 150px;">
                            <th:block th:if="${session.ROLE == '03' and data.statusName == '03'}">
                                <select th:id="'isdone-' + ${item.detailId}" class="form-select form-select-sm">
                                    <option value="true" th:selected="${item.isDone == true}">Found</option>
                                    <option value="false" th:selected="${item.isDone == false}">Lost</option>
                                </select>
                            </th:block>
                            <th:block th:unless="${session.ROLE == '03' and data.statusName == '03'}">
                                <span th:if="${item.isDone == true}" class="badge bg-success">Found</span>
                                <span th:if="${item.isDone == false}" class="badge bg-danger">Lost</span>
                                <span th:if="${item.isDone == null}" class="badge bg-secondary">N/A</span>
                            </th:block>
                        </td>
                        <td>
                            <th:block th:if="${session.ROLE == '03' and data.statusName == '03'}">
                                <input type="text" th:id="'note-' + ${item.detailId}" class="form-control form-control-sm" 
                                       th:value="${item.note}" placeholder="Enter note...">
                            </th:block>
                            <th:block th:unless="${session.ROLE == '03' and data.statusName == '03'}">
                                <span th:text="${item.note}"></span>
                            </th:block>
                        </td>


                        <!-- Database Status Readonly -->
                        <td class="text-center">
                            <span class="badge bg-secondary" th:text="${item.dbStatusName}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>


        <div class="d-flex justify-content-between align-items-center mt-4">
            <a th:href="@{/viewRequest}" class="btn btn-outline-secondary btn-sm px-4">&laquo; Back</a>
            
            <div class="actions">
                <!-- Nút cho Warehouse hoàn tất -->
                <button th:if="${session.ROLE == '03' and data.statusName == '03'}" 
                        class="btn btn-primary" onclick="completeInventory()">
                    Complete Inventory
                </button>

                <!-- Nút cho Manager cập nhật Asset trong DB khi ở IN_PROGRESS -->
                <button th:if="${session.ROLE == '02' and data.statusName == '05'}" 
                        class="btn btn-warning" onclick="updateAssets()">
                    <i class="fas fa-sync-alt"></i> Update Asset Statuses
                </button>
            </div>
        </div>
    </main>
</th:block>

<th:block layout:fragment="additional-scripts">
    <script>
        const requestId = [[${data.requestId}]];

        function confirmInventoryItem(detailId) {
            const isDoneStr = document.getElementById('isdone-' + detailId).value;
            const isDone = isDoneStr === 'true';
            const note = document.getElementById('note-' + detailId).value;

            if (!confirm('Save inventory result for this asset?')) return;

            fetch('/api/inventory/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    detailId: detailId,
                    isDone: isDone,
                    note: note
                })
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Error saving data. Please try again.');
                }
            });
        }

        function completeInventory() {
            if (!confirm('Are you sure you have finished checking ALL assets? This will update records and send to Manager.')) return;

            const items = [];
            const rows = document.querySelectorAll('select[id^="isdone-"]');
            rows.forEach(select => {
                const detailId = select.id.replace('isdone-', '');
                const isDoneStr = select.value;
                if(isDoneStr === '') return; // Skip if somehow unselected (unlikely initially)
                const isDone = isDoneStr === 'true';
                const noteInput = document.getElementById('note-' + detailId);
                const note = noteInput ? noteInput.value : '';
                
                items.push({
                    detailId: parseInt(detailId),
                    isDone: isDone,
                    note: note
                });
            });

            fetch('/api/inventory/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    requestId: requestId, 
                    items: items 
                })
            }).then(response => {
                if (response.ok) {
                    alert('Inventory completed and sent to Manager!');
                    location.reload();
                } else {
                    alert('Error completing inventory.');
                }
            });
        }

        function updateAssets() {
            if (!confirm('Are you sure you want to update Asset statuses based on Warehouse check (Marking missing assets as LOST)? This will complete the request.')) return;

            fetch('/api/inventory/update-assets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId: requestId })
            }).then(response => {
                if (response.ok) {
                    alert('Assets updated successfully! Request marked as COMPLETED.');
                    location.reload();
                } else {
                    alert('Error updating assets.');
                }
            });
        }
    </script>
</th:block>
</body>
</html>

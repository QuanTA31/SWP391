<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Asset Tracker - Inventory Process</title>
    <style>
        .filter-section { background: #f8f9fa; border-radius: 8px; padding: 15px; }
        .is-done-row { background-color: #f0fff4 !important; color: #6c757d; }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <main class="content-right p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold text-primary m-0">Inventory Detail: #<span th:text="${data.requestId}"></span></h5>
            <span class="badge bg-primary px-3 py-2" th:text="${data.statusName}"></span>
        </div>

        <div class="filter-section mb-4 border">
            <form method="get" th:action="@{/inventory/process}" class="row g-3">
                <input type="hidden" name="requestId" th:value="${data.requestId}">
                <div class="col-md-4">
                    <input type="text" name="fullName" class="form-control form-control-sm"
                           placeholder="Search by User Name..." th:value="${param.fullName}">
                </div>
                <div class="col-md-3">
                    <select name="assetTypeId" class="form-select form-select-sm">
                        <option value="">All Asset Types</option>
                        <option th:each="type : ${T(com.example.swp391_assetmanagement.enums.AssetType).values()}"
                                th:value="${type.value}" th:text="${type.name}"
                                th:selected="${param.assetTypeId == type.value}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Filter</button>
                </div>
            </form>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Asset Code</th>
                        <th>Type</th>
                        <th>Current User</th>
                        <th class="text-center">New Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${data.items}" th:classappend="${item.isDone} ? 'is-done-row' : ''">
                        <td class="fw-bold" th:text="${item.assetCode}"></td>
                        <td th:text="${item.assetTypeName}"></td>
                        <td th:text="${item.userFullName}"></td>
                        <td class="text-center" style="width: 200px;">
                            <select th:id="'status-' + ${item.detailId}" class="form-select form-select-sm"
                                    th:disabled="${session.ROLE != '03' or item.isDone}">

                                <option value="02" th:selected="${item.statusId == '02'}">ASSIGNED</option>
                                <option value="07" th:selected="${item.statusId == '07'}">LOST</option>

                            </select>
                        </td>
                        <td class="text-center">
                            <button th:if="${session.ROLE == '03' and !item.isDone}"
                                    class="btn btn-sm btn-success px-3"
                                    th:onclick="'confirmInventoryItem(' + ${item.detailId} + ')'">
                                Confirm
                            </button>
                            <span th:if="${item.isDone}" class="text-success fw-bold small">
                                <i class="fas fa-check-circle"></i> Checked
                            </span>
                            <span th:if="${session.ROLE != '03' and !item.isDone}" class="text-muted small">
                                Waiting...
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/viewRequest}" class="btn btn-outline-secondary btn-sm px-4">&laquo; Back</a>
        </div>
    </main>
</th:block>

<th:block layout:fragment="additional-scripts">
    <script>
        function confirmInventoryItem(detailId) {
            const selectedStatus = document.getElementById('status-' + detailId).value;

            if (!confirm('Confirm that status for asset?')) return;

            fetch('/api/inventory/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    detailId: detailId,
                    selectedStatus: selectedStatus
                })
            }).then(response => {
                if (response.ok) {
                    alert('Updated inventory!');
                    location.reload();
                } else {
                    alert('Error, Please try again.');
                }
            });
        }
    </script>
</th:block>
</body>
</html>

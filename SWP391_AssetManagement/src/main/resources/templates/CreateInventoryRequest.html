<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Asset Tracker - Create Inventory Request</title>
</head>
<body>
<th:block layout:fragment="content">
    <main class="content-right p-4">
        <div class="toolbar mb-3">
            <div class="toolbar-left">
                <h5 class="fw-semibold m-0">Create Inventory Request</h5>
            </div>
        </div>

        <div class="card shadow-sm border-0 p-4" style="max-width: 600px;">
            <form th:action="@{/inventory/create}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Select Department to Inventory:</label>
                    <select name="locationId" class="form-select" required>
                        <option value="">-- Select Location --</option>

                        <option th:each="loc : ${locations}"
                                th:value="${loc.value}"
                                th:text="${loc.name}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4"
                            onclick="return confirm('Do you want to create request Inventory this department?')">
                        Create Request
                    </button>
                    <a th:href="@{/viewRequest}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asset Tracker - Recover Asset</title>
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tùy chỉnh để giống ảnh mẫu */
        .btn-apply {
            background-color: #ff9800; /* Màu cam của nút Apply Filter */
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-apply:hover {
            background-color: #e68a00;
            color: white;
        }
        .filter-select {
            width: 140px !important;
        }
        .filter-input {
            width: 180px !important;
        }
        .table thead th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <header class="app-header">
        <div class="logo">Asset Tracker</div>
        <div class="nav-right">Request List</div>
    </header>

    <div class="app-content">
        <aside class="sidebar">
            <div class="fw-bold mb-3">Menu</div>
            <a href="#" class="menu-item">View Asset</a>
            <a href="#" class="menu-item active">Recover Asset</a>
        </aside>

        <main class="content-right">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fw-bold">Recover Asset (Disabled Users)</h5>

                <form th:action="@{/recover-asset/manager/recoverAsset}" method="get" class="d-flex gap-2">
                    <select name="locationId" class="form-select form-select-sm filter-select">
                        <option value="">Location</option>
                        <option th:each="loc : ${locations}"
                                th:value="${loc.value}"
                                th:text="${loc.name}"
                                th:selected="${assets.filters != null && loc.value == assets.filters.locationId}"></option>
                    </select>

                    <select name="assetTypeId" class="form-select form-select-sm filter-select">
                        <option value="">Asset Type</option>
                        <option th:each="type : ${assetTypes}"
                                th:value="${type.value}"
                                th:text="${type.name}"
                                th:selected="${assets.filters != null && type.value == assets.filters.assetTypeId}"></option>
                    </select>

                    <select name="status" class="form-select form-select-sm filter-select">
                        <option value="">Asset Status</option>
                        <option value="03">DISABLED</option>
                    </select>

                    <input type="text" name="assetCode" class="form-control form-control-sm filter-input"
                           placeholder="Search Asset Code"
                           th:value="${assets.filters?.assetCode}">

                    <button type="submit" class="btn-apply shadow-sm">Apply Filter</button>
                </form>
            </div>

            <form th:action="@{/recover-asset/manager/execute-recover}" method="post" id="recoverForm" class="flex-grow-1 d-flex flex-column overflow-hidden">
                <div class="table-responsive flex-grow-1">
                    <table class="table table-bordered table-hover shadow-sm align-middle">
                        <thead class="table-light text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 40px;">
                                <input type="checkbox" id="selectAll" class="form-check-input">
                            </th>
                            <th>Asset Code</th>
                            <th>Description</th>
                            <th>Received Date</th>
                            <th>Location</th>
                            <th>Asset Type</th>
                            <th>Owner</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${assets.assets != null}" th:each="item : ${assets.assets}">
                            <td class="text-center">
                                <input type="checkbox" name="selectedAssetCodes"
                                       th:value="${item.assetCode}" class="form-check-input asset-checkbox">
                            </td>
                            <td th:text="${item.assetCode}" class="fw-bold"></td>
                            <td th:text="${item.description}"></td>
                            <td th:text="${item.receivedDate}"></td>
                            <td th:text="${item.locationName}"></td>
                            <td th:text="${item.assetTypeName}"></td>
                            <td><span class="badge bg-danger" th:text="${item.username}"></span></td>
                        </tr>
                        <tr th:if="${assets.assets == null || #lists.isEmpty(assets.assets)}">
                            <td colspan="7" class="text-center py-5 text-muted">No data found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 p-2 bg-light border-top">
                    <div class="text-muted small">
                        Showing 1 – <span th:text="${assets.assets.size()}">0</span> of <span th:text="${assets.totalAsset}">0</span>
                    </div>

                    <button type="submit" id="btnSubmitRecover" class="btn btn-primary btn-sm fw-bold px-4 shadow-sm" disabled>
                        Recover Selected
                    </button>

                    <nav th:if="${assets.totalPages > 1}">
                        <ul class="pagination pagination-sm m-0">
                            <li class="page-item" th:classappend="${!assets.hasPreviousPage} ? 'disabled'">
                                <a class="page-link" th:href="@{/recover-asset/manager/recoverAsset(pageIndex=${assets.page - 1}, assetCode=${assets.filters?.assetCode}, locationId=${assets.filters?.locationId}, assetTypeId=${assets.filters?.assetTypeId})}">&laquo;</a>
                            </li>
                            <li class="page-item active"><a class="page-link" href="#" th:text="${assets.page}">1</a></li>
                            <li class="page-item" th:classappend="${!assets.hasNextPage} ? 'disabled'">
                                <a class="page-link" th:href="@{/recover-asset/manager/recoverAsset(pageIndex=${assets.page + 1}, assetCode=${assets.filters?.assetCode}, locationId=${assets.filters?.locationId}, assetTypeId=${assets.filters?.assetTypeId})}">&raquo;</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </form>
        </main>
    </div>
</div>

<script>
    const selectAll = document.getElementById('selectAll');
    const btnSubmit = document.getElementById('btnSubmitRecover');
    const checkboxes = () => document.querySelectorAll('.asset-checkbox');

    function updateSubmitButton() {
        const cbs = checkboxes();
        const checkedCount = document.querySelectorAll('.asset-checkbox:checked').length;
        btnSubmit.disabled = checkedCount === 0;

        if (cbs.length > 0 && checkedCount === cbs.length) {
            selectAll.checked = true;
        } else {
            selectAll.checked = false;
        }
    }

    if (selectAll) {
        selectAll.addEventListener('change', function() {
            checkboxes().forEach(cb => cb.checked = this.checked);
            updateSubmitButton();
        });
    }

    document.addEventListener('change', function(e) {
        if (e.target.classList.contains('asset-checkbox')) {
            updateSubmitButton();
        }
    });
</script>
</body>
</html>

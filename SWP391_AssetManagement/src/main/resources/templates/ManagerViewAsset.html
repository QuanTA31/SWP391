<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/MainLayout}">

<head>
    <meta charset="utf-8">
    <title>View Asset</title>

    <th:block layout:fragment="additional-css">
        <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
        <link rel="stylesheet" th:href="@{/css/AllocationScreens.css}">
        <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    </th:block>
</head>

<body>
    <th:block layout:fragment="content">
        <div class="content-right">

            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">Main View Asset</span>
                </div>

                <form method="get" th:action="@{/viewAsset}">
                    <div class="toolbar-right">

                        <select name="locationId" class="form-select form-select-sm">
                            <option value="">Location</option>
                            <option th:each="loc : ${T(com.example.swp391_assetmanagement.enums.Location).values()}"
                                th:value="${loc.value}" th:text="${loc.name}" th:selected="${assets.filters != null
                      and assets.filters.locationId != null
                      and loc.value == assets.filters.locationId}">
                            </option>
                        </select>

                        <select name="assetTypeId" class="form-select form-select-sm">
                            <option value="">Asset Type</option>
                            <option th:each="type : ${T(com.example.swp391_assetmanagement.enums.AssetType).values()}"
                                th:value="${type.value}" th:text="${type.name}" th:selected="${assets.filters != null
                      and assets.filters.assetTypeId != null
                      and type.value == assets.filters.assetTypeId}">
                            </option>
                        </select>

                        <select name="assetStatusId" class="form-select form-select-sm">
                            <option value="">Asset Status</option>
                            <option
                                th:each="status : ${T(com.example.swp391_assetmanagement.enums.AssetStatus).values()}"
                                th:value="${status.value}" th:text="${status.name}" th:selected="${assets.filters != null
                      and assets.filters.assetStatusId != null
                      and status.value == assets.filters.assetStatusId}">
                            </option>
                        </select>

                        <input type="text" name="searchWord" class="form-control form-control-sm"
                            placeholder="Search Asset Code" th:value="${(assets.filters != null
                           and assets.filters.searchWord != null) ? assets.filters.searchWord : ''}">

                        <button class="btn btn-sm btn-save-draft" type="submit">
                            Apply Filter
                        </button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-sm table-hover table-fixed">
                        <thead>
                            <tr>
                                <th class="col-checkbox text-center"><input type="checkbox"></th>
                                <th class="col-asset-tag">Asset Code</th>
                                <th>Description</th>
                                <th class="col-price">Price</th>
                                <th class="col-price">Warranty</th>
                                <th class="col-price">Received</th>
                                <th class="col-location">Location</th>
                                <th class="col-price">Status</th>
                                <th class="col-used-by">Current User</th>
                                <th class="col-item-type">Asset Type</th>
                                <th th:if="${session.ROLE == '02'}" class="col-price">Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${assets.assetResponses == null || assets.assetResponses.isEmpty()}">
                                <td colspan="10" class="text-center text-muted">
                                    No data found
                                </td>
                            </tr>

                            <tr th:each="asset : ${assets.assetResponses}">
                                <td class="text-center"><input type="checkbox"></td>
                                <td th:text="${asset.assetCode}"></td>
                                <td>
                                    <div class="text-multiline" th:title="${asset.describe}" th:text="${asset.describe}">
                                    </div>
                                </td>
                                <td th:text="${#numbers.formatDecimal(asset.originalPrice, 0, 'COMMA', 0, 'POINT')}">
                                </td>
                                <td th:text="${asset.warrantyPeriod}"></td>
                                <td th:text="${#temporals.format(asset.receivedDate, 'yyyy-MM-dd')}"></td>
                                <td th:text="${asset.locationName}"></td>
                                <td th:text="${asset.assetStatusName}"></td>
                                <td th:text="${asset.currentUserName}"></td>
                                <td th:text="${asset.assetTypeName}"></td>
                                <td th:if="${session.ROLE == '02'}" class="text-center">
                                    <a th:href="@{/viewAsset/lifecycle(assetCode=${asset.assetCode})}"
                                        class="btn btn-sm btn-outline-primary"
                                        title="View Asset Lifecycle">Lifecycle</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="content-pagination">
                <div class="pagination-info">
                    Showing
                    <strong th:text="${(assets.filters.page -1) * assets.filters.pageSize + 1}">1</strong>
                    –
                    <strong
                        th:text="${(assets.filters.page -1) * assets.filters.pageSize + assets.assetResponses.size()}">15</strong>
                    of
                    <strong th:text="${assets.filters.totalItems}">100</strong>
                </div>

                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${!assets.filters.hasPreviousPage} ? 'disabled'">
                        <a class="page-link" th:href="@{/viewAsset(
                       pageIndex=${assets.filters.page - 1},
                       locationId=${assets.filters.locationId},
                       assetTypeId=${assets.filters.assetTypeId},
                       assetStatusId=${assets.filters.assetStatusId},
                       searchWord=${assets.filters.searchWord}
                   )}">«</a>
                    </li>

                    <th:block th:if="${assets.filters.totalPages != null}">
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, assets.filters.totalPages - 1)}"
                            th:classappend="${i +1 == assets.filters.page} ? 'active'">
                            <a class="page-link" th:text="${i + 1}" th:href="@{/viewAsset(
                           pageIndex=${i+1},
                           locationId=${assets.filters.locationId},
                           assetTypeId=${assets.filters.assetTypeId},
                           assetStatusId=${assets.filters.assetStatusId},
                           searchWord=${assets.filters.searchWord}
                       )}"></a>
                        </li>
                    </th:block>

                    <li class="page-item" th:classappend="${!assets.filters.hasNextPage} ? 'disabled'">
                        <a class="page-link" th:href="@{/viewAsset(
                       pageIndex=${assets.filters.page + 1},
                       locationId=${assets.filters.locationId},
                       assetTypeId=${assets.filters.assetTypeId},
                       assetStatusId=${assets.filters.assetStatusId},
                       searchWord=${assets.filters.searchWord}
                   )}">»</a>
                    </li>
                </ul>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="additional-scripts">
        <script th:src="@{/js/Template.js}"></script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Purchased Asset List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/MainView.css}">
</head>

<body class="d-flex flex-column min-vh-100">

<div class="app-wrapper d-flex flex-column flex-grow-1">

  <!-- HEADER -->
  <div class="app-header d-flex justify-content-between p-3 border-bottom">
    <span class="fw-bold">Purchased Asset List</span>
    <span>Asset Tracker</span>
  </div>

  <div class="app-content d-flex flex-grow-1">

    <!-- SIDEBAR -->
    <div class="sidebar p-3 border-end" style="width:200px;">
      <div class="fw-semibold mb-2">Menu</div>

      <a th:href="@{/viewAsset}" class="menu-item">
        View Asset
      </a>

      <a th:href="@{/viewRequest}" class="menu-item">
        View Request
      </a>

      <a th:if="${session.ROLE == '03'}"
         th:href="@{/purchase-requests/warehouse/view(assetRequestId='')}" class="menu-item">
        Create Purchase Request
      </a>

      <a th:if="${session.ROLE == '03'}"
         th:href="@{/purchase-requests/viewPurchaseAsset}" class="menu-item">
        View Purchase Asset
      </a>

    </div>

    <!-- CONTENT -->
    <div class="content-right flex-fill p-3 d-flex flex-column">

      <!-- TOOLBAR -->
      <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="mb-0">Purchased Asset List</h5>

        <!-- FILTER -->
        <form method="get"
              th:action="@{/purchase-requests/viewPurchaseAsset}"
              class="d-flex gap-2">

          <select name="assetTypeId"
                  class="form-select form-select-sm"
                  style="width:200px">

            <option value="">All Asset Types</option>

            <option th:each="type : ${T(com.example.swp391_assetmanagement.enums.AssetType).values()}"
                    th:value="${type.value}"
                    th:text="${type.name}"
                    th:selected="${type.value == purchaseAsset.filterPurchaseAssetDTOResponse.assetTypeId}">
            </option>
          </select>

          <input type="text"
                 name="searchWord"
                 class="form-control form-control-sm"
                 placeholder="Search by Asset Code"
                 th:value="${purchaseAsset.filterPurchaseAssetDTOResponse.searchWord}"
                 style="width:220px">

          <button type="submit"
                  class="btn btn-sm btn-primary">
            Search
          </button>
        </form>
      </div>

      <!-- TABLE AREA (flex-grow để đẩy footer xuống đáy) -->
      <div class="table-responsive flex-grow-1">
        <table class="table table-bordered table-sm table-hover">
          <thead class="table-light">
          <tr>
            <th>Asset Code</th>
            <th>Asset Type</th>
            <th>Status</th>
            <th>Warranty</th>
            <th>Original Price</th>
            <th>Approved Date</th>
          </tr>
          </thead>

          <tbody>

          <!-- NO DATA -->
          <tr th:if="${purchaseAsset.purchaseAssetDTOResponses.isEmpty()}">
            <td colspan="6" class="text-center text-muted">
              No data found
            </td>
          </tr>

          <!-- DATA -->
          <tr th:each="asset : ${purchaseAsset.purchaseAssetDTOResponses}">
            <td th:text="${asset.assetCode}"></td>
            <td th:text="${asset.assetTypeName}"></td>
            <td th:text="${asset.assetStatusName}"></td>
            <td th:text="${#temporals.format(asset.warrantyPeriod,'yyyy-MM-dd')}"></td>
            <td th:text="${#numbers.formatDecimal(asset.originalPrice,0,'COMMA',0,'POINT')}"></td>
            <td th:text="${#temporals.format(asset.approvedDate,'yyyy-MM-dd')}"></td>
          </tr>

          </tbody>
        </table>
      </div>

      <!-- FOOTER / PAGINATION (luôn nằm đáy nhờ mt-auto) -->
      <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">

        <!-- LEFT -->
        <div class="small text-muted">
          Showing
          <strong th:text="${purchaseAsset.filterPurchaseAssetDTOResponse.totalItems == 0 ? 0 :
                        (purchaseAsset.filterPurchaseAssetDTOResponse.page - 1) * purchaseAsset.filterPurchaseAssetDTOResponse.pageSize + 1}">
          </strong>
          –
          <strong th:text="${purchaseAsset.purchaseAssetDTOResponses.size() == 0 ? 0 :
                        (purchaseAsset.filterPurchaseAssetDTOResponse.page - 1) * purchaseAsset.filterPurchaseAssetDTOResponse.pageSize + purchaseAsset.purchaseAssetDTOResponses.size()}">
          </strong>
          of
          <strong th:text="${purchaseAsset.filterPurchaseAssetDTOResponse.totalItems}"></strong>
        </div>

        <!-- RIGHT -->
        <ul class="pagination pagination-sm mb-0">

          <li class="page-item"
              th:classappend="${!purchaseAsset.filterPurchaseAssetDTOResponse.hasPreviousPage} ? 'disabled'">
            <a class="page-link"
               th:href="@{/purchase-requests/viewPurchaseAsset(
                                pageIndex=${purchaseAsset.filterPurchaseAssetDTOResponse.page - 1},
                                assetTypeId=${purchaseAsset.filterPurchaseAssetDTOResponse.assetTypeId},
                                searchWord=${purchaseAsset.filterPurchaseAssetDTOResponse.searchWord}
                           )}">
              «
            </a>
          </li>

          <li class="page-item"
              th:each="i : ${#numbers.sequence(1, purchaseAsset.filterPurchaseAssetDTOResponse.totalPages)}"
              th:classappend="${i == purchaseAsset.filterPurchaseAssetDTOResponse.page} ? 'active'">

            <a class="page-link"
               th:text="${i}"
               th:href="@{/purchase-requests/viewPurchaseAsset(
                                pageIndex=${i},
                                assetTypeId=${purchaseAsset.filterPurchaseAssetDTOResponse.assetTypeId},
                                searchWord=${purchaseAsset.filterPurchaseAssetDTOResponse.searchWord}
                           )}">
            </a>
          </li>

          <li class="page-item"
              th:classappend="${!purchaseAsset.filterPurchaseAssetDTOResponse.hasNextPage} ? 'disabled'">
            <a class="page-link"
               th:href="@{/purchase-requests/viewPurchaseAsset(
                                pageIndex=${purchaseAsset.filterPurchaseAssetDTOResponse.page + 1},
                                assetTypeId=${purchaseAsset.filterPurchaseAssetDTOResponse.assetTypeId},
                                searchWord=${purchaseAsset.filterPurchaseAssetDTOResponse.searchWord}
                           )}">
              »
            </a>
          </li>

        </ul>
      </div>

    </div>
  </div>
</div>

</body>
</html>

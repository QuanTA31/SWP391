<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Yêu Cầu Mua Sắm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/createPurchaseRequest.css}">

</head>
<body>

<div class="page-wrapper">

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-title">
            📋 Yêu Cầu Mua Sắm
        </div>
        <!-- Badge trạng thái: ẩn/hiện tuỳ isSubmitted -->
        <span class="badge badge-draft"
              th:if="${!purchaseRequest.submitted and purchaseRequest.assetRequestId == null}">
            Tạo mới
        </span>
        <span class="badge badge-pending"
              th:if="${!purchaseRequest.submitted and purchaseRequest.assetRequestId != null}">
            Bản nháp
        </span>
        <span class="badge badge-view"
              th:if="${purchaseRequest.submitted}">
            Chờ phê duyệt
        </span>
    </div>

    <!-- Form chính -->
    <form th:action="@{/purchase-requests/warehouse/save}"
          th:object="${purchaseRequest}"
          method="post"
          id="purchaseForm">

        <!-- Hidden fields -->
        <input type="hidden" th:field="*{assetRequestId}"/>
        <input type="hidden" th:field="*{submitted}" id="isSubmittedField"/>

        <!-- Thông tin chung (chỉ hiện khi có assetRequestId) -->
        <div class="card" th:if="${purchaseRequest.assetRequestId != null}">
            <div class="card-header">
                <div class="icon">📄</div>
                Thông tin yêu cầu
            </div>
            <div class="card-body">
                <div class="info-grid">
                    <div class="info-item">
                        <label>Mã yêu cầu</label>
                        <span th:text="'#' + ${purchaseRequest.assetRequestId}">—</span>
                    </div>
                    <div class="info-item">
                        <label>Loại yêu cầu</label>
                        <span>Mua sắm</span>
                    </div>
                    <div class="info-item">
                        <label>Ngày tạo</label>
                        <span>—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách tài sản cần mua -->
        <div class="card">
            <div class="card-header">
                <div class="icon">📦</div>
                Danh sách tài sản cần mua
            </div>

            <div class="table-wrapper">
                <table id="detailTable">
                    <thead>
                    <tr>
                        <th style="width:40px">#</th>
                        <th>Loại tài sản</th>
                        <th style="width:120px">Số lượng</th>
                        <th>Ghi chú</th>
                        <!-- Cột xóa chỉ hiện khi không phải view mode -->
                        <th th:if="${!purchaseRequest.submitted}" style="width:50px"></th>
                    </tr>
                    </thead>
                    <tbody id="detailBody">

                    <!-- Loop các dòng đã có -->
                    <tr th:each="detail, stat : *{createPurchaseRequestDetailDTORequestList}"
                        th:id="'row-' + ${stat.index}">

                        <!-- Hidden: id của detail (null nếu row mới) -->
                        <td style="display:none">
                            <input type="hidden"
                                   th:name="'createPurchaseRequestDetailDTORequestList[' + ${stat.index} + '].assetExternalRequestDetailId'"
                                   th:value="${detail.assetExternalRequestDetailId}"/>
                        </td>

                        <td class="row-index" th:text="${stat.index + 1}">1</td>

                        <!-- Asset Type -->
                        <td>
                            <!-- View mode: readonly -->
                            <span th:if="${purchaseRequest.submitted}"
                                  class="readonly-cell"
                                  th:text="${detail.assetTypeId}">—</span>
                            <!-- Edit mode: dropdown -->
                            <select th:if="${!purchaseRequest.submitted}"
                                    th:name="'createPurchaseRequestDetailDTORequestList[' + ${stat.index} + '].assetTypeId'">
                                <option value="">-- Chọn loại --</option>
                                <option th:each="type : ${assetTypes}"
                                        th:value="${type.value}"
                                        th:text="${type.name()}"
                                        th:selected="${type.value == detail.assetTypeId}">
                                </option>
                            </select>
                        </td>

                        <!-- Quantity -->
                        <td>
                                <span th:if="${purchaseRequest.submitted}"
                                      class="readonly-cell"
                                      th:text="${detail.quantity}">—</span>
                            <input th:if="${!purchaseRequest.submitted}"
                                   type="number" min="1"
                                   th:name="'createPurchaseRequestDetailDTORequestList[' + ${stat.index} + '].quantity'"
                                   th:value="${detail.quantity}"
                                   placeholder="0"/>
                        </td>

                        <!-- Note -->
                        <td>
                                <span th:if="${purchaseRequest.submitted}"
                                      class="readonly-cell"
                                      th:text="${detail.note}">—</span>
                            <textarea th:if="${!purchaseRequest.submitted}"
                                      th:name="'createPurchaseRequestDetailDTORequestList[' + ${stat.index} + '].note'"
                                      rows="1"
                                      placeholder="Ghi chú..."
                                      th:text="${detail.note}"></textarea>
                        </td>

                        <!-- Nút xóa -->
                        <td th:if="${!purchaseRequest.submitted}">
                            <button type="button" class="btn btn-ghost"
                                    onclick="removeRow(this)" title="Xóa dòng">✕</button>
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!-- Nút thêm dòng (chỉ hiện khi edit mode) -->
            <div class="add-row-area" th:if="${!purchaseRequest.submitted}">
                <button type="button" class="btn btn-outline" onclick="addRow()">
                    + Thêm dòng
                </button>
            </div>

            <!-- Footer: Save Draft + Submit (warehouse) -->
            <div class="form-footer" th:if="${!purchaseRequest.submitted}">
                <button type="button" class="btn btn-outline" onclick="saveDraft()">
                    💾 Lưu nháp
                </button>
                <button type="button" class="btn btn-primary" onclick="submitForm()">
                    📤 Gửi phê duyệt
                </button>
            </div>

        </div>

        <!-- Approval section: chỉ hiện cho manager (isSubmitted = true) -->
        <div class="card" th:if="${purchaseRequest.submitted and approvalRequest != null}"
             th:object="${approvalRequest}">
            <div class="card-header">
                <div class="icon">✅</div>
                Phê duyệt yêu cầu
            </div>
            <div class="card-body">
                <input type="hidden" th:field="*{assetRequestId}"/>
                <div class="approval-section">
                    <button type="button" class="btn btn-success"
                            onclick="approveRequest()">
                        ✅ Phê duyệt
                    </button>
                    <button type="button" class="btn btn-danger"
                            onclick="rejectRequest()">
                        ❌ Từ chối
                    </button>
                </div>
            </div>
        </div>

    </form>

    <!-- Form riêng cho approval POST -->
    <form th:if="${purchaseRequest.submitted and approvalRequest != null}"
          id="approvalForm"
          th:action="@{/purchase-requests/manager/approve}"
          th:object="${approvalRequest}"
          method="post">
        <input type="hidden" th:field="*{assetRequestId}"/>
        <input type="hidden" th:field="*{approved}" id="approvedField"/>
    </form>

</div>

<script th:inline="javascript">
    // Đếm số dòng hiện tại
    let rowIndex = /*[[${purchaseRequest.createPurchaseRequestDetailDTORequestList != null
                        ? purchaseRequest.createPurchaseRequestDetailDTORequestList.size()
                        : 0}]]*/ 0;

    // Lấy danh sách assetTypes từ server để render dropdown động
    const assetTypes = /*[[${assetTypes}]]*/ [];

    function buildSelectOptions(selectedValue) {
        let html = '<option value="">-- Chọn loại --</option>';
        if (assetTypes && assetTypes.length) {
            assetTypes.forEach(function(type) {
                const val   = type.value  || type;
                const label = type.name   || type;
                const sel   = (val === selectedValue) ? 'selected' : '';
                html += `<option value="${val}" ${sel}>${label}</option>`;
            });
        }
        return html;
    }

    function addRow() {
        const tbody = document.getElementById('detailBody');
        const i = rowIndex;

        const tr = document.createElement('tr');
        tr.id = 'row-' + i;
        tr.innerHTML = `
            <td style="display:none">
                <input type="hidden"
                       name="createPurchaseRequestDetailDTORequestList[${i}].assetExternalRequestDetailId"
                       value=""/>
            </td>
            <td class="row-index">${tbody.rows.length + 1}</td>
            <td>
                <select name="createPurchaseRequestDetailDTORequestList[${i}].assetTypeId">
                    ${buildSelectOptions('')}
                </select>
            </td>
            <td>
                <input type="number" min="1"
                       name="createPurchaseRequestDetailDTORequestList[${i}].quantity"
                       placeholder="0"/>
            </td>
            <td>
                <textarea name="createPurchaseRequestDetailDTORequestList[${i}].note"
                          rows="1" placeholder="Ghi chú..."></textarea>
            </td>
            <td>
                <button type="button" class="btn btn-ghost"
                        onclick="removeRow(this)" title="Xóa dòng">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
        rowIndex++;
        reIndex();
    }

    function removeRow(btn) {
        const row = btn.closest('tr');
        row.remove();
        reIndex();
    }

    function reIndex() {
        const rows = document.querySelectorAll('#detailBody tr');
        rows.forEach(function(row, i) {
            const indexCell = row.querySelector('.row-index');
            if (indexCell) indexCell.textContent = i + 1;
        });
    }

    function saveDraft() {
        document.getElementById('isSubmittedField').value = 'false';
        document.getElementById('purchaseForm').submit();
    }

    function submitForm() {
        if (!validateRows()) return;
        document.getElementById('isSubmittedField').value = 'true';
        document.getElementById('purchaseForm').submit();
    }

    function validateRows() {
        const selects = document.querySelectorAll('#detailBody select');
        for (let s of selects) {
            if (!s.value) {
                alert('Vui lòng chọn loại tài sản cho tất cả các dòng.');
                s.focus();
                return false;
            }
        }
        const inputs = document.querySelectorAll('#detailBody input[type="number"]');
        for (let inp of inputs) {
            if (!inp.value || parseInt(inp.value) < 1) {
                alert('Số lượng phải lớn hơn 0.');
                inp.focus();
                return false;
            }
        }
        return true;
    }

    function approveRequest() {
        document.getElementById('approvedField').value = 'true';
        document.getElementById('approvalForm').submit();
    }

    function rejectRequest() {
        document.getElementById('approvedField').value = 'false';
        document.getElementById('approvalForm').submit();
    }
</script>

</body>
</html>

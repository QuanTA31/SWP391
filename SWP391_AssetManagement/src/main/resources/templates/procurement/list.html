<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Option Detail - List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/ViewAsset.css}">
</head>

<body>

<div class="app-wrapper">
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Option Detail</span>
    </div>

    <div class="app-content">
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">Main View Asset</div>
            <div class="menu-item">Create Request</div>
            <div class="menu-item">View Request</div>
            <div class="menu-item">Approval Request</div>
            <div class="menu-item active">View Option Detail</div>
        </div>

        <div class="content-right">
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">View Option Detail</span>
                </div>
                <div class="toolbar-right">
                    <a class="btn btn-sm btn-save-draft"
                       th:href="@{/procurement/create(processId=${processId})}">
                        Create Option
                    </a>
                </div>
            </div>

            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-sm table-hover w-100">
                        <colgroup>
                            <col style="width: 140px;">
                            <col>
                            <col style="width: 110px;">
                            <col style="width: 180px;">
                            <col style="width: 150px;">
                            <col style="width: 140px;">
                        </colgroup>
                        <thead>
                        <tr>
                            <th class="col-asset-tag">Merchant</th>
                            <th>Description</th>
                            <th class="col-price">Unit Price</th>
                            <th class="col-price">Status</th>
                            <th class="col-price">Approved At</th>
                            <th style="width: 140px;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${plans == null || plans.isEmpty()}">
                            <td colspan="6" class="text-center text-muted">
                                No data found
                            </td>
                        </tr>
                        <tr th:each="p : ${plans}">
                            <td th:text="${p.merchant}"></td>
                            <td class="text-multiline" th:text="${p.description}"></td>
                            <td th:text="${p.unitPrice}"></td>
                            <td>
                                <form method="post" th:action="@{/procurement/approval}">
                                    <input type="hidden" name="id" th:value="${p.id}">
                                    <input type="hidden" name="processId" th:value="${processId}">
                                    <select name="approvalStatusId"
                                            class="form-select form-select-sm"
                                            th:style="${p.approvalStatusId == '01'} ? 'background-color: #ffc107; color: #212529; width: 100%; min-width: 160px;' :
                                                     (${p.approvalStatusId == '02'} ? 'background-color: #198754; color: #ffffff; width: 100%; min-width: 160px;' : 'background-color: #dc3545; color: #ffffff; width: 100%; min-width: 160px;')">
                                        <option th:each="ap : ${T(com.example.swp391_assetmanagement.enums.ApprovalStatus).values()}"
                                                th:value="${ap.value}"
                                                th:text="${ap.name}"
                                                th:selected="${ap.value == p.approvalStatusId}">
                                        </option>
                                    </select>
                                    <button class="btn btn-sm btn-save-draft mt-1" type="submit">
                                        Update
                                    </button>
                                </form>
                            </td>
                            <td>Manager1</td>
                            <td th:text="${p.approvedAt != null ? #temporals.format(p.approvedAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td>
                                <a class="btn btn-sm btn-outline-primary mb-1"
                                   th:href="@{/procurement/edit/{id}(id=${p.id}, processId=${processId})}">
                                    Edit
                                </a>
                                <form method="post"
                                      th:action="@{/procurement/delete/{id}(id=${p.id})}">
                                    <input type="hidden" name="processId" th:value="${processId}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

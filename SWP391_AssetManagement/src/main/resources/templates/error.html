<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

<div class="error-container">
    <div class="error-card">

        <!-- HTTP Status -->
        <div class="error-code" th:text="${status}">500</div>

        <!-- Error title -->
        <div class="error-title">
            Oops! Có lỗi xảy ra
        </div>

        <!-- Error message -->
        <div class="error-message"
             th:text="${error}">
            Internal Server Error
        </div>

        <!-- Error details -->
        <div class="error-details">
            <p>
                <strong>Message:</strong>
                <span th:text="${message}">Unexpected error</span>
            </p>
            <p>
                <strong>Path:</strong>
                <span th:text="${path}">/unknown</span>
            </p>
            <p>
                <strong>Time:</strong>
                <span th:text="${timestamp}">2026-02-02</span>
            </p>
        </div>

        <!-- Actions -->
        <div class="error-actions">
            <a th:href="@{/}" class="btn primary">🏠 Về trang chủ</a>
            <a href="javascript:history.back()" class="btn secondary">⬅ Quay lại</a>
        </div>

    </div>
</div>

</body>
</html>

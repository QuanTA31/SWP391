<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Create Request | Asset Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/MainView.css">
    <link rel="stylesheet" href="/css/OptionDetail.css">

</head>

<body>

<div class="app-wrapper">

    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Administrator System</span>
    </div>

    <div class="app-content">

        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">Main View Asset</div>
            <div class="menu-item active">Create Request</div>
            <div class="menu-item">View Request</div>
            <div class="menu-item">Approval Request</div>
        </div>

        <div class="content-right">

            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">Tạo Yêu Cầu Cấp Phát Tài Sản</span>
                </div>
            </div>

            <div class="table-container shadow-sm">
                <div class="form-content-area">
                    <form action="#" method="POST">

                        <div class="section-title">1. Thông tin bàn giao</div>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Nhân viên nhận (To User) <span class="text-danger">*</span></label>
                                <select class="form-select">
                                    <option value="" selected>-- Chọn nhân viên --</option>
                                    <option value="1">M0001 - quanta (Phòng IT)</option>
                                    <option value="2">M0002 - nguyenvana (Phòng Sale)</option>
                                    <option value="3">M0003 - lethisang (Phòng HR)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ngày cấp phát dự kiến <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" value="2026-01-30">
                            </div>
                        </div>

                        <div class="section-title">2. Lựa chọn tài sản</div>
                        <div class="row mb-4">
                            <div class="col-md-12">
                                <label class="form-label">Tài sản đang trống trong kho <span class="text-danger">*</span></label>
                                <select class="form-select">
                                    <option value="" selected>-- Chọn tài sản từ danh sách --</option>
                                    <option value="1">PC-0001 | PC (RTX 5070, 12GB Ram)</option>
                                    <option value="2">LT-0055 | LAPTOP (Dell XPS 15)</option>
                                    <option value="3">MON-002 | MONITOR (LG 27 inch 4K)</option>
                                    <option value="4">CH-012 | CHAIR (Ghế xoay văn phòng)</option>
                                </select>
                            </div>
                        </div>

                        <div class="section-title">3. Lý do & Ghi chú</div>
                        <div class="row mb-4">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Lý do cấp phát <span class="text-danger">*</span></label>
                                <textarea class="form-control" rows="3" placeholder="Nhập lý do chi tiết..."></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Ghi chú (Note)</label>
                                <textarea class="form-control" rows="2" placeholder="Các yêu cầu cài đặt hoặc vận chuyển kèm theo..."></textarea>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary px-4">Hủy bỏ</button>
                            <button type="submit" class="btn-submit-request">Gửi Yêu Cầu</button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="content-pagination">
                <div class="pagination-info">
                    * Lưu ý: Yêu cầu sau khi gửi sẽ được chuyển đến <strong>Trưởng phòng/Quản lý</strong> phê duyệt.
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Asset Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/RequestInternalList.css}">
</head>

<body>

<div class="app-wrapper">

    <!-- HEADER -->
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Request List</span>
    </div>

    <div class="app-content">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">Main View Asset</div>
            <div class="menu-item">Create Request</div>
            <div class="menu-item active">View Internal Request</div>
            <div class="menu-item">Approval Request</div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content-right">

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">View Request</span>
                </div>

                <!-- FILTER -->
                <form method="get" th:action="@{/main/viewInternalRequest}">
                    <div class="toolbar-right">

                        <!-- REQUEST STATUS -->
                        <select name="requestStatusId" class="form-select form-select-sm">
                            <option value="">Request Status</option>
                            <option th:each="st : ${T(com.example.swp391_assetmanagement.enums.RequestStatus).values()}"
                                    th:value="${st.value}"
                                    th:text="${st.name}"
                                    th:selected="${internal != null
                                      and internal.filters != null
                                      and internal.filters.requestStatusId != null
                                      and st.value == internal.filters.requestStatusId}">
                            </option>
                        </select>

                        <!-- REQUEST TYPE -->
                        <select name="requestTypeId" class="form-select form-select-sm">
                            <option value="">Request Type</option>
                            <option th:each="tp : ${T(com.example.swp391_assetmanagement.enums.RequestType).values()}"
                                    th:value="${tp.value}"
                                    th:text="${tp.name}"
                                    th:selected="${internal != null
                                      and internal.filters != null
                                      and internal.filters.requestTypeId != null
                                      and tp.value == internal.filters.requestTypeId}">
                            </option>
                        </select>



                        <button class="btn btn-sm btn-save-draft" type="submit">
                            Apply Filter
                        </button>
                    </div>
                </form>
            </div>

            <!-- TABLE -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-sm table-hover table-fixed">
                        <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Asset Request</th>
                            <th>Asset Type</th>
                            <th>Quantity</th>
                            <th>From Location</th>
                            <th>To Location</th>
                            <th>From User</th>
                            <th>To User</th>
<!--                            <th>Execution Date</th>-->
<!--                            <th>Handover Date</th>-->
<!--                            <th>Approval Status</th>-->
                            <th>Note</th>
                            <th>Create At</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!-- NO internal -->
                        <tr th:if="${internal == null
                                or internal.internalProcessResponses == null
                                or internal.internalProcessResponses.isEmpty()}">
                            <td colspan="9" class="text-center text-muted">
                                No data found
                            </td>
                        </tr>

                        <!-- HAS internal -->
                        <tr th:each="item : ${internal.internalProcessResponses}">
                            <td th:text="${item.assetId}"></td>
                            <td th:text="${item.assetRequestName}"></td>
                            <td th:text="${item.assetTypeName}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${item.fromLocationName}"></td>
                            <td th:text="${item.toLocationName}"></td>
                            <td th:text="${item.fromUserName}"></td>
                            <td th:text="${item.toUserName}"></td>
<!--                            <td th:text="${#temporals.format(item.dateOfExecution, 'yyyy-MM-dd')}"></td>-->
<!--                            <td th:text="${#temporals.format(item.handoverDate, 'yyyy-MM-dd')}"></td>-->
<!--                            <td th:text="${item.approvalStatusName}"></td>-->
                            <td th:text="${item.note}"></td>
                            <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}"></td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- PAGINATION -->
            <div class="content-pagination">

                <div class="pagination-info"
                     th:if="${internal != null and internal.filters != null}">
                    Showing
                    <strong th:text="${(internal.filters.page - 1) * internal.filters.pageSize + 1}">1</strong>
                    –
                    <strong th:text="${(internal.filters.page - 1) * internal.filters.pageSize
                            + (internal.internalProcessResponses != null ? internal.internalProcessResponses.size() : 0)}">15</strong>
                    of
                    <strong th:text="${internal.filters.totalItems}">0</strong>
                </div>

                <ul class="pagination pagination-sm mb-0">

                    <!-- PREVIOUS -->
                    <li class="page-item"
                        th:classappend="${internal == null or !internal.filters.hasPreviousPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/main/viewInternalRequest(
                               pageIndex=${internal.filters.page - 1},
                               requestStatusId=${internal.filters.requestStatusId},
                               requestTypeId=${internal.filters.requestTypeId}

                           )}">
                            «
                        </a>
                    </li>

                    <!-- PAGE NUMBERS -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, internal.filters.totalPages)}"
                        th:classappend="${i == internal.filters.page} ? 'active'">
                        <a class="page-link"
                           th:text="${i}"
                           th:href="@{/main/viewInternalRequest(
                               pageIndex=${i},
                               requestStatusId=${internal.filters.requestStatusId},
                               requestTypeId=${internal.filters.requestTypeId}
                           )}">
                        </a>
                    </li>

                    <!-- NEXT -->
                    <li class="page-item"
                        th:classappend="${internal == null or !internal.filters.hasNextPage} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/main/viewInternalRequest(
                               pageIndex=${internal.filters.page + 1},
                               requestStatusId=${internal.filters.requestStatusId},
                               requestTypeId=${internal.filters.requestTypeId}
                           )}">
                            »
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </div>
</div>

</body>
</html>

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: admin-layout(~{:: .content-right})}">
<head>
    <title>User Management | Asset Tracker</title>
</head>
<body>

<div class="content-right">
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="fw-semibold">User Management</span>
        </div>

        <form method="get" th:action="@{/admin/viewUser}">
            <div class="toolbar-right">
                <select name="locationId" class="form-select form-select-sm">
                    <option value="">All Locations</option>
                    <option th:each="loc : ${T(com.example.swp391_assetmanagement.enums.Location).values()}"
                            th:value="${loc.value}"
                            th:text="${loc.name}"
                            th:selected="${users.filters.locationId == loc.value}">
                    </option>
                </select>

                <select name="roleID" class="form-select form-select-sm">
                    <option value="">All Roles</option>
                    <option th:each="role : ${T(com.example.swp391_assetmanagement.enums.Roles).values()}"
                            th:value="${role.value}"
                            th:text="${role.name}"
                            th:selected="${users.filters.roleId == role.value}">
                    </option>
                </select>

                <select name="status" class="form-select form-select-sm">
                    <option value="">All Status</option>
                    <option th:each="userStatus : ${T(com.example.swp391_assetmanagement.enums.UserStatus).values()}"
                            th:value="${userStatus.value}"
                            th:text="${userStatus.name}"
                            th:selected="${users.filters.status == userStatus.value}">
                    </option>
                </select>

                <input type="text" name="name" class="form-control form-control-sm"
                       placeholder="Search Name..." th:value="${users.filters.name}">

                <button class="btn btn-sm" type="submit" style="background-color: #29b6f6; color: white;">
                    Search
                </button>
            </div>
        </form>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-fixed">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Location</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${users.userDTOResponses == null || users.userDTOResponses.isEmpty()}">
                    <td colspan="7" class="text-center text-muted">No users found</td>
                </tr>
                <tr th:each="u : ${users.userDTOResponses}">
                    <td th:text="${u.username}" class="fw-semibold"></td>
                    <td th:text="${u.name}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.phone}"></td>
                    <td th:text="${u.locationName}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${u.roleName}"></span>
                    </td>
                    <td>
                        <select class="form-select form-select-sm"
                                th:onchange="changeStatus([[${u.username}]], this.value)">
                            <option th:each="status : ${T(com.example.swp391_assetmanagement.enums.UserStatus).values()}"
                                    th:value="${status.value}"
                                    th:text="${status.name}"
                                    th:selected="${u.status == status.value}">
                            </option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="content-pagination">
        <div class="pagination-info">
            Showing
            <strong th:text="${(users.filters.page - 1) * users.filters.pageSize + 1}">1</strong> to
            <strong th:text="${(users.filters.page - 1) * users.filters.pageSize + users.userDTOResponses.size()}">15</strong> of
            <strong th:text="${users.filters.totalUser}">100</strong>
        </div>

        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${!users.filters.hasPreviousPage} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/viewUser(pageIndex=${users.filters.page - 1}, locationId=${users.filters.locationId}, roleID=${users.filters.roleId}, name=${users.filters.name})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, users.filters.totalPages)}"
                th:classappend="${i == users.filters.page} ? 'active'">
                <a class="page-link" th:text="${i}"
                   th:href="@{/admin/viewUser(pageIndex=${i}, locationId=${users.filters.locationId}, roleID=${users.filters.roleId}, name=${users.filters.name})}"></a>
            </li>
            <li class="page-item" th:classappend="${!users.filters.hasNextPage} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/viewUser(pageIndex=${users.filters.page + 1}, locationId=${users.filters.locationId}, roleID=${users.filters.roleId}, name=${users.filters.name})}">»</a>
            </li>
        </ul>
    </div>

    <script th:inline="javascript">
        function changeStatus(username, newStatus) {
            if (!confirm("Are you sure update status for this user?")) {
                location.reload();
                return;
            }

            const params = new URLSearchParams();
            params.append('username', username);
            params.append('status', newStatus);

            fetch(`/admin/viewUser/updateStatus`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            })
                .then(response => {
                    if (response.ok) { alert("Update status success!"); }
                    else { alert("Update status fail!"); location.reload(); }
                })
                .catch(error => { console.error('Error:', error); alert("Something went wrong."); });
        }
    </script>
</div>

</body>
</html>

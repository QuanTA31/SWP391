<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập - Asset Tracker</title>

    <link href="/css/login.css" rel="stylesheet">
</head>
<body>

<div class="login-card">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username"
                           class="form-control" placeholder="Nhập username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control" placeholder="Nhập mật khẩu" required>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                    <small th:text="${error}"></small>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-login">Login</button>
                </div>

            </form>

    </div>
</div>

</body>
</html>

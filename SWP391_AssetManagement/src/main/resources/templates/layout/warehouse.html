<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="warehouse-layout(content)">
    <head>
        <meta charset="utf-8">
        <title>Asset Tracker - Warehouse</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/MainView.css}">
        <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
        <link rel="stylesheet" th:href="@{/css/createPurchaseRequest.css}">
    </head>
    <body>

        <div class="app-wrapper">

            <div class="app-header">
                <span>Asset Tracker</span>
                <span>Warehouse Management System</span>
            </div>

            <div class="app-content">

                <div class="sidebar">
                    <div class="fw-semibold mb-2">Menu</div>

                    <a th:href="@{/viewAsset}" class="menu-item">
                        View Asset
                    </a>

                    <a th:href="@{/viewRequest}" class="menu-item active">
                        View Request
                    </a>

                    <a th:href="@{/purchase-requests/warehouse/view(assetRequestId='')}" class="menu-item">
                        Create Purchase Request
                    </a>
                </div>

                <div th:replace="${content}"></div>
            </div>
        </div>

    </body>
</html>

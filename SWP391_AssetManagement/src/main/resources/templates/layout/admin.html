<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="admin-layout(content)">
    <head>
        <meta charset="utf-8">
        <title>Asset Tracker - Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/MainView.css}">
        <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
    </head>
    <body>

        <div class="app-wrapper">

            <div class="app-header">
                <span>Asset Tracker</span>
                <span>User Management System</span>
            </div>

            <div class="app-content">

                <div class="sidebar">
                    <div class="fw-semibold mb-2">Menu</div>

                    <a th:href="@{/admin/viewUser}"
                       class="menu-item"
                       th:classappend="${activePage == 'viewUser'} ? 'active' : ''">
                        View All Users
                    </a>

                    <a th:href="@{/admin/createUser}"
                       class="menu-item"
                       th:classappend="${activePage == 'createUser'} ? 'active' : ''">
                        Create User
                    </a>
                </div>

                <div th:replace="${content}"></div>
            </div>
        </div>

    </body>
</html>

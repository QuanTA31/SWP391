<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="manager-layout(content)">
    <head>
        <meta charset="utf-8">
        <title>Asset Tracker - Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/MainView.css}">
        <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
        <link rel="stylesheet" th:href="@{/css/AllocationScreens.css}">
    </head>
    <body>

        <div class="app-wrapper">

            <div class="app-header">
                <span>Asset Tracker</span>
                <span>Request Management System</span>
            </div>

            <div class="app-content">

                <div class="sidebar">
                    <div class="fw-semibold mb-2">Menu</div>

                    <a th:if="${session.ROLE != '05'}" th:href="@{/viewAsset}" class="menu-item"
                       th:classappend="${activePage == 'viewAsset'} ? 'active' : ''">
                        View Asset
                    </a>

                    <a th:href="@{/viewRequest}" class="menu-item"
                       th:classappend="${activePage == 'viewRequest'} ? 'active' : ''">
                        View Request
                    </a>

                    <a th:if="${session.ROLE == '03'}"
                       th:href="@{/purchase-requests/warehouse/view(assetRequestId='')}" class="menu-item"
                       th:classappend="${activePage == 'createPurchase'} ? 'active' : ''">
                        Create Purchase Request
                    </a>

                    <a th:if="${session.ROLE == '05'}"
                       th:href="@{/allocation/department/create(assetRequestId='')}" class="menu-item"
                       th:classappend="${activePage == 'createAllocation'} ? 'active' : ''">
                        Create Allocation Request
                    </a>
                    <a th:if="${session.ROLE == '05'}"
                       th:href="@{/maintenance-requests/create(assetRequestId='')}" class="menu-item">
                        Create Maintain Request
                    </a>
                </div>

                <div th:replace="${content}"></div>
            </div>
        </div>

    </body>
</html>

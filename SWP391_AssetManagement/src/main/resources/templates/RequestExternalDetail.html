<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Asset Tracker - External Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/RequestExternalList.css}">
</head>

<body>

<div class="app-wrapper">

    <div class="app-header">
        <span>Asset Tracker</span>
        <span>External Request Detail</span>
    </div>

    <div class="app-content">

        <!-- FULL WIDTH CONTENT -->
        <div class="content-full">

            <div class="toolbar d-flex justify-content-between align-items-center">
                <div class="toolbar-left d-flex align-items-center gap-2">
<!--                    <a th:href="@{/main/viewRequest}" class="btn btn-sm btn-outline-secondary">-->
                    <a th:href="@{/viewRequest}" class="btn btn-sm btn-outline-secondary">
                        &laquo; Back
                    </a>

                    <span class="fw-semibold ms-2">
                        Detail for Request #<span th:text="${requestId}" class="text-success"></span>
                    </span>
                </div>
            </div>

            <div class="table-container mt-3">
                <div class="table-responsive">
                    <table class="table table-sm table-hover table-fixed table-bordered">
                        <thead class="table-light">
                        <tr>
                            <th>Request ID</th>
                            <th>Asset Type</th>
                            <th>External Status</th>
                            <th>Quantity</th>
                            <th>Note</th>
                            <th>Created At</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:if="${detailData == null
                                  or detailData.externalProcessResponses == null
                                  or detailData.externalProcessResponses.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <em>No items found in this request.</em>
                            </td>
                        </tr>

                        <tr th:each="item : ${detailData.externalProcessResponses}">
                            <td th:text="${item.assetRequestName}" class="fw-bold"></td>
                            <td th:text="${item.assetTypeName}"></td>
                            <td th:text="${item.externalStatusName}" class="text-primary"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${item.note}"></td>
                            <td th:text="${item.createdAt}"></td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Option Detail - Manager Approval</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
    <style>
        /* Highlight dòng khi được chọn */
        .row-approved { background-color: #e8f5e9 !important; border-left: 4px solid #28a745 !important; }
        .row-rejected { background-color: #fff1f0 !important; border-left: 4px solid #f5222d !important; }

        /* Cột Decision giữ nền trắng nhẹ để tách biệt */
        .action-cell { white-space: nowrap; background-color: #ffffff !important; }

        /* Đảm bảo radio button luôn có nền trắng */
        .form-check-input {
            background-color: #fff !important;
            border: 1px solid #ced4da !important;
        }

        /* Màu khi radio được tích (dấu chấm xanh mặc định của Bootstrap) */
        .form-check-input:checked {
            background-color: #fff !important;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='2' fill='%230d6efd'/%3e%3c/svg%3e") !important;
            border-color: #0d6efd !important;
        }
    </style>
</head>

<body>

<div class="app-wrapper" th:if="${session.ROLE != null and session.ROLE.toString() == '02'}">
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Manager Approval</span>
    </div>

    <div class="app-content">
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">View Asset</div>
            <div class="menu-item">View Request</div>
            <div class="menu-item active">Approval Option Detail</div>
        </div>

        <div class="content-right">
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold text-primary">Decision for Request Detail #<span th:text="${asset_external_request_detail_id}"></span></span>
                </div>
                <div class="toolbar-right">
                    <a th:href="@{/viewRequest}" class="btn btn-sm btn-secondary">Back to List</a>
                </div>
            </div>

            <form th:action="@{/purchase-requests/manager/optionDetail}"
                  method="post"
                  class="d-flex flex-column flex-grow-1">
                <input type="hidden" name="asset_external_request_detail_id" th:value="${asset_external_request_detail_id}">

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover w-100">
                            <colgroup>
                                <col style="width: 140px;">
                                <col style="width: 200px;">
                                <col style="width: 110px;">
                                <col style="width: 110px;">
                                <col style="width: 100px;">
                                <col style="width: 120px;">
                                <col style="width: 220px;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>Merchant</th>
                                <th>Description</th>
                                <th class="col-price">Unit Price</th>
                                <th>Warranty</th>
                                <th>Current</th>
                                <th>Approver</th>
                                <th class="text-center bg-light fw-bold text-primary">Manager's Decision</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${plans == null or #lists.isEmpty(plans)}">
                                <td colspan="7" class="text-center text-muted py-4">No data found</td>
                            </tr>

                            <tr th:each="p, iterStat : ${plans}" class="js-option-row align-middle">
                                <td th:text="${p.merchant}"></td>
                                <td th:text="${p.description}"></td>
                                <td th:text="${p.unitPrice}"></td>
                                <td th:text="${p.warrantyPeriod}"></td>
                                <td>
                                    <span th:class="${p.isSelected == true ? 'badge bg-success' : 'badge bg-secondary'}"
                                          th:text="${p.isSelected == true ? 'Selected' : '-'}"></span>
                                </td>
                                <td th:text="${p.approverBy}"></td>

                                <td class="text-center action-cell border-start shadow-sm">
                                    <input type="hidden"
                                           th:name="|selections[${iterStat.index}].optionDetailId|"
                                           th:value="${p.id}">

                                    <div class="d-flex justify-content-center gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input js-radio-approve" type="radio"
                                                   th:name="|selections[${iterStat.index}].isSelected|"
                                                   value="true"
                                                   th:id="${'t_' + p.id}">
                                            <label class="form-check-label text-success fw-bold" th:for="${'t_' + p.id}">Approve</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input js-radio-reject" type="radio"
                                                   th:name="|selections[${iterStat.index}].isSelected|"
                                                   value="false"
                                                   th:id="${'f_' + p.id}">
                                            <label class="form-check-label text-danger fw-bold" th:for="${'f_' + p.id}">Reject</label>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-3 d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-sm btn-save-draft px-4 shadow">Save Final Decision</button>
                </div>

                <div class="content-pagination">
                    <div class="pagination-info">
                        Showing
                        <strong th:text="${totalItems == 0 ? 0 : (page - 1) * pageSize + 1}">0</strong>
                        -
                        <strong th:text="${totalItems == 0 ? 0 : (page - 1) * pageSize + (plans != null ? plans.size() : 0)}">0</strong>
                        of
                        <strong th:text="${totalItems}">0</strong>
                    </div>

                    <ul class="pagination pagination-sm mb-0">

                        <li class="page-item" th:classappend="${!hasPreviousPage} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/purchase-requests/manager/approvalOptionDetail(
                    requestDetailId=${asset_external_request_detail_id},
                    page=${page - 1}
               )}">
                                &laquo;
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${i == page} ? 'active'">
                            <a class="page-link"
                               th:text="${i}"
                               th:href="@{/purchase-requests/manager/approvalOptionDetail(
                    requestDetailId=${asset_external_request_detail_id},
                    page=${i}
               )}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${!hasNextPage} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/purchase-requests/manager/approvalOptionDetail(
                    requestDetailId=${asset_external_request_detail_id},
                    page=${page + 1}
               )}">
                                &raquo;
                            </a>
                        </li>

                    </ul>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:unless="${session.ROLE != null and session.ROLE.toString() == '02'}" class="container mt-5 text-center">
    <div class="card p-5 shadow border-0">
        <h2 class="text-danger">Access Denied</h2>
        <a href="/viewRequest" class="btn btn-primary mt-3">Quay lại</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const approveRadios = document.querySelectorAll('.js-radio-approve');
        const rejectRadios = document.querySelectorAll('.js-radio-reject');

        function updateStyles() {
            document.querySelectorAll('.js-option-row').forEach(row => {
                const appRadio = row.querySelector('.js-radio-approve');
                const rejRadio = row.querySelector('.js-radio-reject');

                row.classList.remove('row-approved', 'row-rejected');
                if (appRadio.checked) row.classList.add('row-approved');
                if (rejRadio.checked) row.classList.add('row-rejected');
            });
        }

        approveRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.checked) {
                    approveRadios.forEach(other => {
                        if (other !== this) {
                            const row = other.closest('tr');
                            const reject = row.querySelector('.js-radio-reject');
                            reject.checked = true;
                        }
                    });
                }
                updateStyles();
            });
        });

        rejectRadios.forEach(radio => {
            radio.addEventListener('change', updateStyles);
        });
    });
</script>
</body>
</html>

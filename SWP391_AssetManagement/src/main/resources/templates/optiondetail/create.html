<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Option Detail - Create</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/MainView.css}">
    <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
</head>

<body>

<div class="app-wrapper">
    <div class="app-header">
        <span>Asset Tracker</span>
        <span>Option Detail</span>
    </div>

    <div class="app-content">
        <div class="sidebar">
            <div class="fw-semibold mb-2">Menu</div>
            <div class="menu-item">Main View Asset</div>
            <div class="menu-item">Create Request</div>
            <div class="menu-item">View Request</div>
            <div class="menu-item">Approval Request</div>
            <div class="menu-item active">Create Option Detail</div>
        </div>

        <div class="content-right">
            <div class="toolbar">
                <div class="toolbar-left">
                    <span class="fw-semibold">Create Option Detail</span>
                </div>
            </div>

            <form th:action="@{/option-detail/create}" method="post" th:object="${plans}">
                <input type="hidden" name="asset_external_request_detail_id" th:value="${asset_external_request_detail_id}"/>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover table-fixed">
                            <thead>
                            <tr>
                                <th class="col-asset-tag">Merchant</th>
                                <th>Description</th>
                                <th class="col-price">Unit Price</th>
                                <th class="col-price">Warranty Period</th>
                            </tr>
                            </thead>
                            <tbody id="option-rows">
                            <tr th:each="p, stat : *{plans}">
                                <td>
                                    <input class="form-control form-control-sm"
                                           th:field="*{plans[__${stat.index}__].merchant}"
                                           th:classappend="${#fields.hasErrors('plans[' + stat.index + '].merchant')} ? 'is-invalid'"
                                           required maxlength="120"/>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('plans[' + stat.index + '].merchant')}"
                                         th:errors="*{plans[__${stat.index}__].merchant}">
                                    </div>
                                </td>
                                <td>
                                    <input class="form-control form-control-sm"
                                           th:field="*{plans[__${stat.index}__].description}"
                                           th:classappend="${#fields.hasErrors('plans[' + stat.index + '].description')} ? 'is-invalid'"
                                           required maxlength="255"/>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('plans[' + stat.index + '].description')}"
                                         th:errors="*{plans[__${stat.index}__].description}">
                                    </div>
                                </td>
                                <td>
                                    <input class="form-control form-control-sm"
                                           th:field="*{plans[__${stat.index}__].unitPrice}"
                                           th:classappend="${#fields.hasErrors('plans[' + stat.index + '].unitPrice')} ? 'is-invalid'"
                                           type="number" step="0.01" min="0.01" required/>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('plans[' + stat.index + '].unitPrice')}"
                                         th:errors="*{plans[__${stat.index}__].unitPrice}">
                                    </div>
                                </td>
                                <td>
                                    <input class="form-control form-control-sm"
                                           th:field="*{plans[__${stat.index}__].warrantyPeriod}"
                                           type="date"/>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="content-footer">
                    <a class="btn btn-sm btn-secondary"
                       th:href="@{/option-detail/list(asset_external_request_detail_id=${asset_external_request_detail_id})}">
                        Back to List
                    </a>
                    <button class="btn btn-sm btn-secondary" type="button" id="add-row">
                        Add Row
                    </button>
                    <button class="btn btn-sm btn-save-draft" type="submit">
                        Save Options
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        const addRowBtn = document.getElementById("add-row");
        const rows = document.getElementById("option-rows");

        if (!addRowBtn || !rows) {
            return;
        }

        addRowBtn.addEventListener("click", function () {
            const currentRows = rows.querySelectorAll("tr");
            const newIndex = currentRows.length;
            const lastRow = currentRows[currentRows.length - 1];
            const newRow = lastRow.cloneNode(true);

            newRow.querySelectorAll("input").forEach(function (input) {
                if (input.name) {
                    input.name = input.name.replace(/\[\d+]/, "[" + newIndex + "]");
                }
                if (input.id) {
                    input.id = input.id.replace(/\d+/, newIndex);
                }
                input.value = "";
            });

            rows.appendChild(newRow);
        });
    })();
</script>

</body>
</html>

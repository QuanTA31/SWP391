<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Option Detail - List</title>
    <th:block layout:fragment="additional-css">
        <link rel="stylesheet" th:href="@{/css/OptionDetail.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="content-right">
        <div class="toolbar">
            <div class="toolbar-left">
                <span class="fw-semibold">View Option Detail</span>
            </div>
            <form class="toolbar-right" method="get" th:action="@{/liquidate/option-detail/list}">
                <input type="hidden" name="asset_external_request_detail_id"
                       th:value="${asset_external_request_detail_id}">
                <select name="status" class="form-select form-select-sm">
                    <option value="all" th:selected="${status == 'all'}">All</option>
                    <option value="selected" th:selected="${status == 'selected'}">Selected</option>
                    <option value="unselected" th:selected="${status == 'unselected'}">Unselected</option>
                </select>
                <button class="btn btn-sm btn-save-draft" type="submit">Filter</button>
            </form>
            <div class="toolbar-right ms-2">
                <a class="btn btn-sm btn-save-draft"
                   data-bs-toggle="modal"
                   data-bs-target="#createOptionModal"
                   th:if="${canManage}">
                    Create Option
                </a>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-sm table-hover w-100">
                    <colgroup>
                        <col style="width: 140px;">
                        <col style="width: 240px;">
                        <col style="width: 110px;">
                        <col style="width: 120px;">
                        <col style="width: 140px;">
                        <col style="width: 120px;">
                        <col style="width: 60px;">
                    </colgroup>
                    <thead>
                    <tr>
                        <th class="col-asset-tag">Merchant</th>
                        <th>Description</th>
                        <th class="col-price">Unit Price</th>
                        <th class="col-price">Status</th>
                        <th class="col-price">Approver</th>
                        <th class="col-price">Approved At</th>
                        <th style="width: 60px;" class="text-center"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${plans == null || plans.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">
                            No data found
                        </td>
                    </tr>
                    <tr th:each="p : ${plans}">
                        <td th:text="${p.merchant}"></td>
                        <td th:text="${p.description}"></td>
                        <td th:text="${p.unitPrice}"></td>
                        <td th:switch="${p.isSelected}">
                                <span class="badge bg-success"
                                      th:case="true">
                                      Approved
                                </span>
                            <span class="badge bg-secondary"
                                  th:case="false">
                                      Reject
                                </span>
                            <span class="badge bg-warning text-dark"
                                  th:case="*">
                                      Pending
                                </span>
                        </td>
                        <td th:text="${p.approverName}"></td>
                        <td th:text="${p.approvedDate != null ? #temporals.format(p.approvedDate, 'yyyy-MM-dd') : ''}"></td>
                        <td class="text-center">
                            <div class="dropdown">
                                <button class="btn btn-sm btn-light p-1 border-0"
                                        type="button"
                                        data-bs-toggle="dropdown">
                                    ⋮
                                </button>

                                <ul class="dropdown-menu">

                                    <!--MANAGER-->
                                    <li th:if="${canApprove}">
                                        <form method="post" th:action="@{/liquidate/option-detail/approval}">
                                            <input type="hidden" name="id" th:value="${p.id}">
                                            <input type="hidden"
                                                   name="asset_external_request_detail_id"
                                                   th:value="${asset_external_request_detail_id}">
                                            <input type="hidden" name="selected" value="true">
                                            <input type="hidden" name="assetRequestId"
                                                   th:value="${assetRequestId}"/>
                                            <button class="dropdown-item" type="submit">
                                                Select
                                            </button>
                                        </form>
                                    </li>

                                    <!--PURCHASING-->
                                    <li th:if="${canManage}">
                                        <button class="dropdown-item"
                                                type="button"
                                                data-bs-toggle="modal"
                                                data-bs-target="#editOptionModal"
                                                th:attr="data-id=${p.id},
                                                    data-merchant=${p.merchant},
                                                    data-description=${p.description},
                                                    data-unit-price=${p.unitPrice}">
                                            Edit
                                        </button>
                                    </li>

                                    <li th:if="${canManage}">
                                        <button class="dropdown-item text-danger"
                                                type="button"
                                                data-bs-toggle="modal"
                                                data-bs-target="#deleteOptionModal"
                                                th:attr="data-id=${p.id},
                                 data-request-detail-id=${asset_external_request_detail_id}">
                                            Delete
                                        </button>
                                    </li>

                                </ul>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="content-pagination">
            <div class="pagination-info">
                Showing
                <strong th:text="${totalItems == 0 ? 0 : (page - 1) * pageSize + 1}">0</strong>
                -
                <strong th:text="${totalItems == 0 ? 0 : (page - 1) * pageSize + (plans != null ? plans.size() : 0)}">0</strong>
                of
                <strong th:text="${totalItems}">0</strong>
            </div>

            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!hasPreviousPage} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/liquidate/option-detail/list(
                               page=${page - 1},
                               status=${status},
                               asset_external_request_detail_id=${asset_external_request_detail_id}
                           )}">
                        &laquo;
                    </a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == page} ? 'active'">
                    <a class="page-link"
                       th:text="${i}"
                       th:href="@{/liquidate/option-detail/list(
                               page=${i},
                               status=${status},
                               asset_external_request_detail_id=${asset_external_request_detail_id}
                           )}">
                    </a>
                </li>

                <li class="page-item" th:classappend="${!hasNextPage} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/liquidate/option-detail/list(
                               page=${page + 1},
                               status=${status},
                               asset_external_request_detail_id=${asset_external_request_detail_id}
                           )}">
                        &raquo;
                    </a>
                </li>
            </ul>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <!-- ONLY MANAGER -->
            <form th:if="${canApprove}"
                  th:action="@{/liquidate/manager/optionDetailRejectAll}"
                  method="post">

                <input type="hidden"
                       name="assetRequestDetailId"
                       th:value="${asset_external_request_detail_id}"/>
                <input type="hidden" name="assetRequestId" th:value="${assetRequestId}">
                <button type="submit"
                        class="btn btn-danger">
                    Reject All
                </button>
            </form>
        </div>
    </div>
</th:block>
<th:block layout:fragment="contentModal">

    <div class="modal fade" id="createOptionModal" tabindex="-1" aria-labelledby="createOptionModalLabel"
         aria-hidden="true" th:if="${canManage}">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createOptionModalLabel">Create Option Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/liquidate/option-detail/create}" method="post" th:object="${createForm}">
                    <div class="modal-body">
                        <!-- 🔴 ERROR MESSAGE -->
                        <div class="alert alert-danger"
                             th:if="${errorMessage}">
                            <span th:text="${errorMessage}"></span>
                        </div>
                        <input type="hidden" name="asset_external_request_detail_id"
                               th:value="${asset_external_request_detail_id}"/>
                        <input type="hidden" name="assetRequestId" th:value="${assetRequestId}"/>
                        <div class="mb-2">
                            <label class="form-label">Merchant</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{merchant}"
                                   th:classappend="${#fields.hasErrors('merchant')} ? 'is-invalid'"
                                   required maxlength="255"/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('merchant')}"
                                 th:errors="*{merchant}">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Describe</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{description}"
                                   th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                   required maxlength="255"/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Unit Price</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{unitPrice}"
                                   th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid'"
                                   type="number" step="0.01" min="0.01" required/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('unitPrice')}"
                                 th:errors="*{unitPrice}">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-sm btn-save-draft" type="submit">Save Option</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editOptionModal" tabindex="-1" aria-labelledby="editOptionModalLabel" aria-hidden="true"
         th:if="${canManage}">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editOptionModalLabel">Edit Option Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="edit-option-form" method="post" th:object="${editForm}"
                      th:action="@{/option-detail/edit/{id}(id=${editForm.id})}">
                    <div class="modal-body">
                        <div class="alert alert-danger"
                             th:if="${editErrorMessage}">
                            <span th:text="${editErrorMessage}"></span>
                        </div>
                        <input type="hidden" name="asset_external_request_detail_id"
                               th:value="${asset_external_request_detail_id}"/>
                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" name="assetRequestId"
                               th:value="${assetRequestId}"/>
                        <div class="mb-2">
                            <label class="form-label">Merchant</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{merchant}"
                                   required maxlength="255"/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Describe</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{description}"
                                   required maxlength="255"/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Unit Price</label>
                            <input class="form-control form-control-sm"
                                   th:field="*{unitPrice}"
                                   type="number" step="0.01" min="0.01" required/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-sm btn-save-draft" type="submit">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteOptionModal" tabindex="-1" aria-labelledby="deleteOptionModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="deleteOptionModalLabel">
                        Confirm Delete
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="text-danger mb-0">
                        Are you sure you want to remove this option?
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-sm btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <form id="delete-option-form" method="post">
                        <input type="hidden"
                               name="asset_external_request_detail_id"
                               id="delete-request-detail-id">
                        <button type="submit"
                                class="btn btn-sm btn-danger">
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</th:block>
<th:block layout:fragment="additional-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            /* ================= EDIT MODAL ================= */
            const editModal = document.getElementById("editOptionModal");
            const editForm = document.getElementById("edit-option-form");
            if (!editModal || !editForm) {
                return;
            }
            editModal.addEventListener("show.bs.modal", function (event) {
                const button = event.relatedTarget;
                if (!button) {
                    return;
                }
                const id = button.getAttribute("data-id");
                const merchant = button.getAttribute("data-merchant");
                const description = button.getAttribute("data-description");
                const unitPrice = button.getAttribute("data-unit-price");
                editForm.action = "/liquidate/option-detail/edit/" + id;
                const idInput = editForm.querySelector('input[name="id"]');
                const merchantInput = editForm.querySelector('input[name="merchant"]');
                const descriptionInput = editForm.querySelector('input[name="description"]');
                const unitPriceInput = editForm.querySelector('input[name="unitPrice"]');
                if (idInput) {
                    idInput.value = id || "";
                }
                if (merchantInput) {
                    merchantInput.value = merchant || "";
                }
                if (descriptionInput) {
                    descriptionInput.value = description || "";
                }
                if (unitPriceInput) {
                    unitPriceInput.value = unitPrice || "";
                }
            });

            /* ================= DELETE MODAL ================= */
            const deleteModal = document.getElementById("deleteOptionModal");
            const deleteForm = document.getElementById("delete-option-form");
            const deleteRequestDetailInput =
                document.getElementById("delete-request-detail-id");

            if (deleteModal && deleteForm && deleteRequestDetailInput) {
                deleteModal.addEventListener("show.bs.modal", function (event) {
                    const button = event.relatedTarget;
                    if (!button) return;

                    const id = button.getAttribute("data-id");
                    const requestDetailId =
                        button.getAttribute("data-request-detail-id");

                    deleteForm.action = "/liquidate/option-detail/delete/" + id;
                    deleteRequestDetailInput.value = requestDetailId;
                });
            }
        })();
    </script>
    <script th:if="${errorMessage}">
        const createModal = new bootstrap.Modal(
            document.getElementById('createOptionModal')
        );
        createModal.show();
    </script>
    <script th:if="${editErrorMessage}">
        const editModal = new bootstrap.Modal(
            document.getElementById('editOptionModal')
        );
        editModal.show();
    </script>
    <script th:if="${openEditModal}">
        const editModal = new bootstrap.Modal(
            document.getElementById('editOptionModal')
        );
        editModal.show();
    </script>
</th:block>
</body>
</html>

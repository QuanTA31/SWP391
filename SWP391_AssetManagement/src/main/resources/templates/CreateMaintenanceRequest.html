<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MainLayout}">
<head>
    <title>Create Maintenance Request | Asset Tracker</title>=
    <th:block layout:fragment="additional-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" th:href="@{/css/createPurchaseRequest.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="content-right">
        <div class="page-card">

            <!-- ── Page header ── -->
            <div class="page-header">
                <div class="icon-box"><i class="bi bi-tools"></i></div>
                <div>
                    <h4>Create Asset Maintenance Request</h4>
                    <small>Department Manager → Submit directly, no approval required</small>
                </div>
            </div>

            <!-- ── Error message ── -->
            <div class="alert-error" th:if="${errorMessage}">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMessage}">An error occurred!</span>
            </div>
            <!-- ── Form ── -->
            <form th:action="@{${requestId == null ? '/maintenance-requests/create' : '/maintenance-requests/update'}}"
                  th:object="${request}"
                  method="POST"
                  id="maintenanceForm">

                <input th:if="${requestId != null}" type="hidden" name="requestId" th:value="${requestId}"/>

                <!-- Hidden field isSubmitted (set by JS buttons) -->
                <input type="hidden" th:field="*{isSubmitted}" id="isSubmittedField" value="false">

                <!-- Section 1: Chọn tài sản -->
                <div class="section-label"><i class="bi bi-box-seam me-1"></i>1 — Select asset to repair</div>

                <div class="mb-3 asset-select-wrap">
                    <label for="assetId" class="form-label">
                        Asset  <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="assetId" th:field="*{assetId}" required
                            th:disabled="${requestStatusId != null and requestStatusId != '01'}">
                        <option value="" selected disabled>-- Select asset from department list --</option>
                        <option th:each="asset : ${assets}"
                                th:value="${asset.id}"
                                th:text="${asset.assetCode + ' | ' + asset.assetTypeId + (asset.description != null ? ' — ' + asset.description : '')}">
                        </option>
                    </select>
                    <input th:if="${requestStatusId != null and requestStatusId != '01'}" type="hidden"
                           th:field="*{assetId}"/>

                    <div class="form-text text-secondary mt-1">
                        <i class="bi bi-info-circle"></i>
                        Only assets belonging to your department are shown.
                    </div>
                </div>

                <div class="section-divider"></div>

                <!-- Section 2: Mô tả lỗi & Mức độ ưu tiên -->
                <div class="section-label"><i class="bi bi-clipboard2-pulse me-1"></i>2 — Issue description &amp; Priority
                </div>

                <div class="mb-3">
                    <label for="issueDescription" class="form-label">
                        Problem / Issue description <span class="text-danger">*</span>
                    </label>
                    <textarea class="form-control"
                              id="issueDescription"
                              th:field="*{issueDescription}"
                              rows="4"
                              placeholder="Describe the symptoms in detail, when it occurred, how it affects operations..."
                              required th:readonly="${requestStatusId != null and requestStatusId != '01'}"></textarea>
                </div>

                <div class="mb-3"
                     th:classappend="${requestStatusId != null and requestStatusId != '01'} ? 'pe-none opacity-75' : ''">
                    <label class="form-label">
                        Priority  <span class="text-danger">*</span>
                    </label>
                    <div class="priority-group">

                        <div class="priority-option low">
                            <input type="radio" id="priorityLow"
                                   th:field="*{priority}" value="LOW" required>
                            <label for="priorityLow">
                                <i class="bi bi-arrow-down-circle"></i> Low
                            </label>
                        </div>

                        <div class="priority-option medium">
                            <input type="radio" id="priorityMedium"
                                   th:field="*{priority}" value="MEDIUM">
                            <label for="priorityMedium">
                                <i class="bi bi-dash-circle"></i> Medium
                            </label>
                        </div>

                        <div class="priority-option high">
                            <input type="radio" id="priorityHigh"
                                   th:field="*{priority}" value="HIGH">
                            <label for="priorityHigh">
                                <i class="bi bi-arrow-up-circle"></i> High
                            </label>
                        </div>

                        <div class="priority-option critical">
                            <input type="radio" id="priorityCritical"
                                   th:field="*{priority}" value="CRITICAL">
                            <label for="priorityCritical">
                                <i class="bi bi-exclamation-octagon"></i> Critical
                            </label>
                        </div>

                    </div>
                </div>

                <div class="section-divider"></div>

                <!-- Section 3: Ghi chú thêm -->
                <div class="section-label"><i class="bi bi-journal-text me-1"></i>3 — Additional notes (optional)</div>

                <div class="mb-1">
                        <textarea class="form-control"
                                  th:field="*{note}"
                                  rows="2"
                                  placeholder="Special requirements, urgent needs, contact technician..."
                                  th:readonly="${requestStatusId != null and requestStatusId != '01'}"></textarea>
                </div>

                <!-- ── Buttons ── -->
                <div class="action-bar">
                    <a th:href="@{/viewAsset}" class="btn btn-sm btn-outline-secondary px-4"
                       style="border-radius:8px; font-weight:600;">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>

                    <button th:if="${requestStatusId == null or (requestStatusId == '01' and isOwner != null and isOwner)}"
                            type="submit"
                            class="btn-save-draft"
                            onclick="setSubmit(false)">
                        <i class="bi bi-floppy me-1"></i>Save Draft
                    </button>

                    <button th:if="${requestStatusId == null or (requestStatusId == '01' and isOwner != null and isOwner)}"
                            type="submit"
                            class="btn-submit-req"
                            onclick="setSubmit(true)">
                        <i class="bi bi-send-fill me-1"></i>Submit Request
                    </button>
                </div>
            </form>


        </div><!-- /page-card -->
    </div><!-- /content-right -->
</th:block>
<th:block layout:fragment="additional-scripts">
    <script th:src="@{/js/Template.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setSubmit(value) {
            document.getElementById('isSubmittedField').value = value;
        }
    </script>
</th:block>
</body>
</html>
